  countdown-actionbar: '&#FF005D&lHOME &8▷ &fTeleporting in &#FF005D&n{seconds}s'
  cancelled-actionbar: '&#FF005D&lHOME &8▷ &fYou moved &8— &7teleport cancelled.'

