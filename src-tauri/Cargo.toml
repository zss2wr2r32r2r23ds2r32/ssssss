[package]
name = "nexa"
version = "0.1.5"
description = "Nexa desktop launcher"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "Nexa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
opener = "0.7"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.1.1", features = ["image-ico"] }
