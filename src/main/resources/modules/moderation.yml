# Moderation Module
# /clearchat and /lockchat commands

enabled: true

chat-locked-on-start: false
clearchat-lines: 100

messages:
  chat-locked: "&cChat is currently locked."
  clearchat-broadcast: "&cChat has been cleared by &f%player%"
  chat-locked-broadcast: "&cChat has been locked by &f%player%"
  chat-unlocked-broadcast: "&aChat has been unlocked by &f%player%"
