# Random teleport. Safe spots are looked for in the background and kept ready,
# so a click does not have to search first.

countdown-seconds: 5
cooldown-seconds: 10

# Costs nothing at 0. Uses the same amounts as /pay, so 10k works too.
cost: 0

# How many finished spots are kept per world and how often they are topped up.
pool-size: 5
refill-seconds: 5

# Never more searches than this at once, so thirty clicks cannot generate
# thirty areas at the same time.
concurrent-searches: 2
attempts: 30

# The first attempts only take chunks that already exist. Pre generate the world
# with Chunky and a teleport never has to create terrain.
prefer-generated: true
generated-attempts: 20

# Hard ceiling on how many chunks the whole server may generate for teleports in
# one minute. Once it is used up only existing chunks are looked at. 0 never
# generates at all, which is the right setting on a pre generated world.
generate-per-minute: 30

# No fall damage and slow falling for this long after landing.
safe-landing-seconds: 5

blocked-biomes:
  - OCEAN
  - DEEP_OCEAN
  - COLD_OCEAN
  - DEEP_COLD_OCEAN
  - FROZEN_OCEAN
  - DEEP_FROZEN_OCEAN
  - LUKEWARM_OCEAN
  - DEEP_LUKEWARM_OCEAN
  - WARM_OCEAN
  - RIVER
  - FROZEN_RIVER

