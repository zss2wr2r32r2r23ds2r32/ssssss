config-version: 3

message-mode: chat

audit-prefix: '&#AD4EFF&lAUDIT LOGS &8> &r'
audit-enabled: true
audit-log-to-file: true
audit-log-file: audit.log
audit-notify-staff: true
audit-notify-permission: sharded.staff.notify
audit-null-permission-commands: false

audit-commands:
  - gamemode
  - gm
  - gmc
  - gms
  - gmsp
  - give
  - tp
  - teleport
  - ban
  - banip
  - kick
  - op
  - deop
  - stop
  - reload
  - whitelist
  - pardon
  - kill
  - clear
  - enchant
  - effect
  - weather
  - time
  - difficulty
  - setblock
  - fill
  - summon
  - shardedcore
  - tokens
  - keys
  - staffmode
  - sfmode
  - vanish
  - freeze
  - punish
  - wipe
  - alts
  - offend
  - unban
  - unmute
  - randomtp
  - stafflist

audit-subcommands:
  - tokens give
  - tokens set
  - tokens remove
  - tokens take
  - tokens reset
  - tokens giveall
  - keys give
  - keys set
  - keys take
  - keys remove

audit-permissions:
  - sharded.tokens.admin
  - sharded.staff.gamemode
  - sharded.staff.mode
  - sharded.staff.punish
  - sharded.staff.ban
  - sharded.staff.banip
  - sharded.staff.wipe
  - sharded.graves.admin
  - sharded.spawn.admin
  - sharded.backpack.admin
  - sharded.fly.admin
  - sharded.admin
  - sharded.kill.others
  - sharded.msg.bypass

audit-command-permissions:
  tokens:
    give: sharded.tokens.admin
    set: sharded.tokens.admin
    remove: sharded.tokens.admin
    take: sharded.tokens.admin
    reset: sharded.tokens.admin
    giveall: sharded.tokens.admin

discord-webhook:
  enabled: false
  url: ''
  title: 'Staff Command Audit'
  description: '**%player%** ran `%command%` in `%world%`'
  color: 11328511

discord: 'discord.gg/shardedmc'
repeat-offender-threshold: 3
staff-list-permission: sharded.staff

public-broadcast:
  enabled: true
  actions:
    - Ban
    - Mute

ban:
  default-reason: 'No reason specified'

ban-screen:
  - '&#AD4EFF&lSHARDEDMC'
  - '&cYou have been banned!'
  - ''
  - '&#AD4EFF⛨&r &fBy: &#AD4EFF%staff%'
  - '&#FF007B⚐&r &fReason: &#FF007B%reason%'
  - '&#45FF17☄&r &fDuration: &#45FF17%time_left%'
  - ''
  - '&#4498DB☀&r &fExpires on: &#4498DB%expires%'
  - ''
  - '&#FFF300&lAPPEAL THIS BAN&r &#FFF300@'
  - '&#FFF300☀ &f%discord%'

ban-screen-permanent:
  - '&#AD4EFF&lSHARDEDMC'
  - '&cYou have been permanently banned!'
  - ''
  - '&#AD4EFF⛨&r &fBy: &#AD4EFF%staff%'
  - '&#FF007B⚐&r &fReason: &#FF007B%reason%'

reasons:
  X-Ray:
    - 7d
    - 14d
    - 30d
  Fly-Hack: 30d
  Killaura: 30d
  ESP: 14d
  Reach: 14d
  Scaffold: 30d
  AutoClicker: 14d
  Anti-Knockback: 30d
  Nuker: 30d
  Chat-Behavior: 1d
  Advertising: 7d
  Hate-Speech: 30d
  Scamming: 7d
  Griefing: 7d
  Bug-Abuse: 7d
  Ban-Evasion: permanent
  Duping: permanent

mute-reasons:
  Spam:
    - 1h
    - 6h
    - 1d
  Caps-Spam: 30m
  Chat-Behavior: 3h
  Disrespect: 3h
  Toxicity: 6h
  Advertising: 1d
  Filter-Bypass: 1d
  Inappropriate: 1d
  Hate-Speech: 7d
  Spoiler: 1h

vanish:
  fly: true
  night-vision: false
  disable-pickup: true
  see-permission: sharded.staff.seevanished

staffmode:
  vanish-on-enter: true
  items:
    vanish:
      slot: 0
      enabled:
        material: LIME_DYE
        display_name: '&#FF8300&lVANISHED'
        lore:
          - '&8Description'
          - ''
          - '#FF8300Information:'
          - '&#FF8300| &fClick here to &#FF8300Disable&f'
          - '&#FF8300| &fyour players &#FF8300vanish&f!'
      disabled:
        material: GRAY_DYE
        display_name: '&#FF0000&lUNVANISHED'
        lore:
          - '&8Description'
          - ''
          - '#FF0000Information:'
          - '&#FF0000| &fClick here to &#FF0000Enable&f'
          - '&#FF0000| &fyour players &#FF0000vanish&f!'
    freeze:
      slot: 7
      material: PACKED_ICE
      display_name: '&#FF8300&lFREEZE PLAYER'
      lore:
        - '&8Description'
        - ''
        - '#FF8300Information:'
        - '&#FF8300| &fRight click a player to &#FF8300freeze&f them.'
        - '&#FF8300| &7Left click to see frozen &#FF8300players&f.'
    punish:
      slot: 4
      material: NETHERITE_AXE
      display_name: '&#FF0000&lPUNISH AXE'
      lore:
        - '&8Description'
        - ''
        - '#FF8300Information:'
        - '&#FF0000| &fHit a &#FF0000player&f to'
        - '&#FF0000| &fopen the punish &#FF0000menu&f.'
    staff-list:
      slot: 3
      material: BOOK
      display_name: '&#FF8300&lSTAFFLIST'
      lore:
        - '&8Description'
        - ''
        - '#FF8300Information:'
        - '&#FF8300| &fClick here to &#FF8300view&f'
        - '&#FF8300| &fonline &#FF8300staff&f members.'
    random-teleport:
      slot: 8
      material: ENDER_PEARL
      display_name: '&#FF8300&lRANDOM TELEPORT'
      lore:
        - '&8Description'
        - ''
        - '#FF8300Information:'
        - '&#FF8300| &fClick here to &#FF8300teleport&f'
        - '&#FF8300| &fto a random &#FF8300player&f.'
    exit:
      slot: 5
      material: BARRIER
      display_name: '&#FF0000&lEXIT STAFF MODE'
      lore:
        - '&#FF0000| &fClick here to leave staff &#FF0000mode&f.'

punish:
  reason-title: '&8🔥 %type% &8| &8%player%'
  reason-item:
    material: PAPER
    display_name: '&#00FFAA%reason%'
    lore:
      - '&8Description'
      - ''
      - '#00FFAAInformation:'
      - '&#00FFAA| &fClick here to &#00FFAAapply&f'
      - '%durations%'
  back:
    material: RED_STAINED_GLASS_PANE
    display_name: '&#FF0000&lPREVIOUS PAGE'
    lore:
      - '&8Description'
      - ''
      - '#FF0000Information:'
      - '&#FF0000| &fClick here to go back'
  menu:
    title: '&8🔥 Punish &8| &8%player%'
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
    target:
      material: PLAYER_HEAD
      display_name: '&#00FFAA%player%'
      lore:
        - '&8Description'
        - ''
        - '#00FFAAInformation:'
        - '&#00FFAA| &fChoose a &#00FFAApunishment&f'
    ban:
      material: NETHERITE_SWORD
      display_name: '&#00FFAA&lBANS'
      lore:
        - '&#00FFAA| &fClick to view ban reasons'
    mute:
      material: BOOK
      display_name: '&#00FFAA&lMUTES'
      lore:
        - '&#00FFAA| &fClick to view mute reasons'
    ipban:
      material: IRON_BARS
      display_name: '&#00FFAA&lIP BAN'
      lore:
        - '&#00FFAA| &fClick to IP ban this player'

wipe:
  confirm-gui: true
  title: '&8🔥 Confirm Wipe &8| &8%player%'
  rows: 3
  kick-screen:
    - '&#FF0000Your player data has been wiped'
    - ''
    - '&fYou may now rejoin the server.'
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    display_name: ' '
  items:
    cancel:
      slot: 11
      material: RED_STAINED_GLASS_PANE
      display_name: '&#FF0000&lCANCEL WIPE'
      lore:
        - '&#FF0000| &fCancel the wipe process'
    info:
      slot: 13
      material: PLAYER_HEAD
      display_name: '&#8845EA%player%'
      lore:
        - '&#8845EA| &fThis permanently deletes:'
        - '&#8845EA| &fInventory and &#8845EAender&f chest'
        - '&#8845EA| &fAll statistics and tokens'
        - '&#8845EA| &#FF0000This cannot be undone.'
    confirm:
      slot: 15
      material: LIME_STAINED_GLASS_PANE
      display_name: '&#8845EA&lCONFIRM WIPE'
      lore:
        - '&#8845EA| &fConfirm the wipe process'
  reasons:
    default:
      - '&#FF0000Your player data has been wiped'
      - ''
      - '&fYou may now rejoin the server.'
    cheating:
      - '&#FF0000Your account was wiped for cheating.'
      - ''
      - '&fAppeal on %discord% if this was a mistake.'
    bug-abuse:
      - '&#FF0000Your account was wiped for bug abuse.'
      - ''
      - '&fYou may rejoin after reading the rules.'

alts:
  max-display: 50
