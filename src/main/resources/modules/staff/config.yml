prefix: "&#FF0000☄ &#FF0000&lSTAFF &8▷ &r"
staff-chat-format: "&#FF0000☄ &#FF0000&lSTAFF &8▷ &f%player%&7: &f%message%"
staff-permission: shardedcore.staff.mode
stafflist-permission: shardedcore.staff.mode
see-vanished: shardedcore.staff.seevanished
audit-permission: shardedcore.staff.audit
discord: discord.gg/shardedmc
repeat-offender-threshold: 3
request-cooldown-seconds: 30
screenshare-seconds: 120
screenshare-ban-reason: Refusing to SS
screenshare-ban-duration: 7d
screenshare:
  title: "&#FF0000&lSCREENSHARE"
  subtitle: "&fPlease Do not log out"
  actionbar: "&fJoin #Screenshare @ discord.gg/shardedmc"
offend-reason: Ban-Evasion
offend-duration: permanent
default-reason: Unfair Modifications
snapshot-interval-minutes: 5
max-snapshots: 20

vanish:
  fly: true
  disable-pickup: true

staffmode:
  vanish-on-enter: true
  disable-eglow-command: eglow:eglow disable
  items:
    vanish-slot: 0
    freeze-slot: 1
    punish-slot: 2
    randomtp-slot: 3
    exit-slot: 8

audit:
  enabled: true
  permission: shardedcore.staff.audit

reasons:
  X-Ray: 7d
  Fly-Hack: 30d
  Killaura: 30d
  Chat-Behavior: 1d
  Advertising: 7d
  Ban-Evasion: permanent
  Doxxing: 30d

ban-screen:
  - "&#AD4EFF&lSHARDEDMC"
  - "&cYou have been banned!"
  - ""
  - "&fBy: &#AD4EFF%staff%"
  - "&fReason: &#FF007B%reason%"
  - "&fDuration: &#45FF17%time%"
  - ""
  - "&#FFF300APPEAL @ %discord%"

mute-commands:
  - msg
  - r
  - reply
  - tell
  - whisper

mute-reasons:
  Spam: 1h
  Toxicity: 6h
  Advertising: 1d

sounds:
  open:
    enabled: true
    sound: ui.button.click
    volume: 0.6
    pitch: 1.2
  click:
    enabled: true
    sound: ui.button.click
    volume: 0.5
    pitch: 1.0
  error:
    enabled: true
    sound: block.note_block.bass
    volume: 0.7
    pitch: 0.8

messages:
  players-only: "%prefix%&#FF2727Only players can use this command."
  no-permission: "%prefix%&#FF2727You don't have permission."
  player-not-found: "%prefix%&#FF2727Player not found."
  usage-player: "%prefix%&#FF2727Usage: &f/%command% <player>"
  usage-unbanip: "%prefix%&#FF2727Usage: &f/unbanip <ip|player|list>"
  staffmode-on: "%prefix%&#9FFF00Staff mode enabled."
  staffmode-off: "%prefix%&#FF2727Staff mode disabled."
  vanish-on: "%prefix%&#9FFF00You are now vanished."
  vanish-off: "%prefix%&#FF2727You are no longer vanished."
  freeze-on: "%prefix%&#9FFF00Froze &f%player%&#9FFF00."
