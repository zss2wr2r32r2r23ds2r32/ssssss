  frozen: "%prefix%&#FF2727You have been frozen."
  unfrozen: "%prefix%&#9FFF00You have been unfrozen."
  gamemode: "%prefix%&#9FFF00Gamemode set to &f%mode%&#9FFF00."
  staffchat-on: "%prefix%&#AD4EFFStaff chat enabled."
  staffchat-off: "%prefix%&#AD4EFFStaff chat disabled."
  stafflist-empty: "%prefix%&#FF2727No staff online."
