prefix: "&#FF0000☄ &#FF0000&lSTAFF &8▷ &r"
staff-chat-format: "&#FF0000☄ &#FF0000&lSTAFF &8▷ &f%player%&7: &f%message%"
staff-permission: shardedcore.staff.mode
stafflist-permission: shardedcore.staff.mode
see-vanished: shardedcore.staff.seevanished
audit-permission: shardedcore.staff.audit
discord: discord.gg/shardedmc
repeat-offender-threshold: 3
request-cooldown-seconds: 30
screenshare-seconds: 120
screenshare-ban-reason: Refusing to SS
screenshare-ban-duration: 7d
screenshare:
  title: "&#FF0000&lSCREENSHARE"
  subtitle: "&fPlease Do not log out"
  actionbar: "&fJoin #Screenshare @ discord.gg/shardedmc"
offend-reason: Ban-Evasion
offend-duration: permanent
default-reason: Unfair Modifications
snapshot-interval-minutes: 5
max-snapshots: 20

# sqlite keeps working if mysql is off. Fill these in to store punishments in MySQL.
database:
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: shardedcore
    username: root
    password: ""

vanish:
  fly: true
  disable-pickup: true

staffmode:
  vanish-on-enter: true
  disable-eglow-command: eglow:eglow disable
  items:
    vanish:
      slot: 0
      material: LIME_DYE
      vanished-material: GRAY_DYE
      name: "&#FF8300&lVANISH"
      vanished-name: "&#8B8B8B&lVANISHED"
      lore:
        - "&8Description"
        - ""
        - "&#FF8300Information:"
        - "&#FF8300| &fHide yourself from"
        - "&#FF8300| &fplayers on the server"
        - ""
        - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Toggle"
      vanished-lore:
        - "&8Description"
        - ""
        - "&#8B8B8BInformation:"
        - "&#8B8B8B| &fYou are currently vanished"
        - "&#8B8B8B| &fClick to show yourself"
        - ""
        - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Toggle"
    freeze:
      slot: 1
      material: PACKED_ICE
      name: "&#00C1FF&lFREEZE"
      lore:
        - "&8Description"
        - ""
        - "&#00C1FFInformation:"
        - "&#00C1FF| &fRight click a player"
        - "&#00C1FF| &fto freeze them"
        - ""
        - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Use"
    punish:
      slot: 2
      material: NETHERITE_AXE
      name: "&#FF0000&lPUNISH"
      lore:
        - "&8Description"
        - ""
        - "&#FF0000Information:"
        - "&#FF0000| &fHit a player"
        - "&#FF0000| &fto open ban mute kick"
        - ""
        - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Use"
    randomtp:
      slot: 3
      material: COMPASS
      name: "&#00A2FF&lRANDOM TP"
      lore:
        - "&8Description"
        - ""
        - "&#00A2FFInformation:"
        - "&#00A2FF| &fTeleport to a random"
        - "&#00A2FF| &fonline player"
        - ""
        - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Teleport"
    exit:
      slot: 8
      material: BARRIER
      name: "&#FF0000&lEXIT STAFF"
      lore:
        - "&8Description"
        - ""
        - "&#FF0000Information:"
        - "&#FF0000| &fLeave staff mode and"
        - "&#FF0000| &frestore your inventory"
        - ""
        - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Exit"

punish:
  title: "Punish"
  rows: 3
  ban:
    slot: 11
    material: IRON_BARS
    name: "&#FF0000&lBAN"
    lore:
      - "&8Description"
      - ""
      - "&#FF0000Information:"
      - "&#FF0000| &fChoose a ban reason"
      - "&#FF0000| &ffor %player%"
      - ""
      - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Open"
  mute:
    slot: 13
    material: BOOK
    name: "&#FFBA00&lMUTE"
    lore:
      - "&8Description"
      - ""
      - "&#FFBA00Information:"
      - "&#FFBA00| &fChoose a mute reason"
      - "&#FFBA00| &ffor %player%"
      - ""
      - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Open"
  kick:
    slot: 15
    material: LEATHER_BOOTS
    name: "&#FF8300&lKICK"
    lore:
      - "&8Description"
      - ""
      - "&#FF8300Information:"
      - "&#FF8300| &fChoose a kick reason"
      - "&#FF8300| &ffor %player%"
      - ""
      - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Open"
  close:
    slot: 26

# Add more reasons here. A list opens a duration picker. A single value bans/mutes immediately.
reasons:
  X-Ray:
    - 7d
    - 14d
    - 30d
  Fly-Hack: 30d
  Killaura: 30d
  ESP: 14d
  Reach: 14d
  Scaffold: 30d
  AutoClicker: 14d
  Anti-Knockback: 30d
  Nuker: 30d
  Chat-Behavior: 1d
  Advertising: 7d
  Hate-Speech: 30d
  Scamming: 7d
  Griefing: 7d
  Bug-Abuse: 7d
  Ban-Evasion: permanent
  Duping: permanent
  Doxxing: permanent
  doxxing: permanent

mute-reasons:
  Spam:
    - 1h
    - 6h
    - 1d
  Caps-Spam: 30m
  Chat-Behavior: 3h
  Disrespect: 3h
  Toxicity: 6h
  Advertising: 1d
  Filter-Bypass: 1d
  Inappropriate: 1d
  Hate-Speech: 7d
  Spoiler: 1h

kick-reasons:
  Cheating: kick
  Toxicity: kick
  Advertising: kick

audit:
  enabled: true
  permission: shardedcore.staff.audit
  staff-only: true
  commands:
    - staffmode
    - sfmode
    - vanish
    - freeze
    - unfreeze
    - punish
    - ban
    - mute
    - kick
    - offend
    - banip
    - unban
    - unbanip
    - unmute
    - pardon
    - alts
    - screenshare
    - ss
    - invrollback
    - revokepunishment
    - gmc
    - gms
    - gmsp
    - gma
    - staffchat
    - sc
    - randomtp
    - stafflist
    - staff

ban-screen:
  - "&#AD4EFF&lSHARDEDMC"
  - "&cYou have been banned!"
  - ""
  - "&fBy: &#AD4EFF%staff%"
  - "&fReason: &#FF007B%reason%"
  - "&fDuration: &#45FF17%time%"
  - ""
  - "&#FFF300APPEAL @ %discord%"

mute-commands:
  - msg
  - r
  - reply
  - tell
  - whisper

sounds:
  open:
    enabled: true
    sound: ui.button.click
    volume: 0.6
    pitch: 1.2
  click:
    enabled: true
    sound: ui.button.click
    volume: 0.5
    pitch: 1.0
  error:
    enabled: true
    sound: block.note_block.bass
    volume: 0.7
    pitch: 0.8

