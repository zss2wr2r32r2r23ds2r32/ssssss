config-version: 2
message-mode: inherit

# World used when portal RTP module is disabled
fallback-world: world

# Open spawn selector on first join only — must pick before closing (SQLite player-state.db)
prompt-on-join: true
prompt-delay-ticks: 40

# Fallback RTP radius if portal RTP is disabled (normally uses portalrtp/config.yml)
rtp-fallback:
  center-x: 0
  center-z: 0
  min-radius: 100
  max-radius: 500
  max-attempts: 25

# main-spawn and vanilla-world are set via /setspawn
