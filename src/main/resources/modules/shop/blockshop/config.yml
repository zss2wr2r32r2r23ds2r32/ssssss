# The block shop. Its icon and its slot in the main menu sit in ../config.yml
# Every item carries the page it belongs to, change page: to move it.

menu:
  title: "&8Shop Menu | Blocks"
  rows: 6
  # The lowest number of pages. More appear on their own as soon as an
  # item sits on a higher one.
  pages: 9

buttons:

  previous:
    slot: 48
    material: RED_STAINED_GLASS_PANE
    name: "&#FF0000&lPREVIOUS PAGE"
    lore:
      - "&8Description"
      - ""
      - "&#FF0000Information:"
      - "&#FF0000¦ &fGo one page back."
      - ""
      - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Navigate"

  return:
    slot: 49
    material: GUSTER_BANNER_PATTERN
    name: "&#FFD900&lRETURN BACK"
    lore:
      - "&8Description"
      - ""
      - "&#FFD900Information:"
      - "&#FFD900¦ &fGo back to the"
      - "&#FFD900¦ &f&#FFD900shop menu&f."
      - ""
      - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Return"

  next:
    slot: 50
    material: LIME_STAINED_GLASS_PANE
    name: "&#99ff00&lUPCOMING PAGE"
    lore:
      - "&8Description"
      - ""
      - "&#99ff00Information:"
      - "&#99ff00¦ &fGo one page forward."
      - ""
      - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Navigate"

# page and slot are yours. name, lore and label are optional and
# fall back to the item-template in ../config.yml
