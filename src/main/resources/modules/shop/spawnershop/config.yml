      - "&#FFD900▷ &n&lCLICK&r&#FFD900 To Return"

  next:
    slot: 23
    material: LIME_STAINED_GLASS_PANE
    name: "&#99ff00&lUPCOMING PAGE"
    lore:
      - "&8Description"
      - ""
      - "&#99ff00Information:"
      - "&#99ff00¦ &fGo one page forward."
      - ""
      - "&#99ff00▷ &n&lCLICK&r&#99ff00 To Navigate"

