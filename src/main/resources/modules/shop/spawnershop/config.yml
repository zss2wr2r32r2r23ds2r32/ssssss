# The spawner shop. Its icon and its slot in the main menu sit in ../config.yml
# Empty on purpose. Drop entries under items: the way the other shops do it,
# the menu picks them up on the next reload.

menu:
  title: "&8Shop Menu | Spawner"
  rows: 3
  pages: 1

buttons:

  previous:
    slot: 21
    material: RED_STAINED_GLASS_PANE
    name: "&#FF0000&lPREVIOUS PAGE"
    lore:
      - "&8Description"
      - ""
      - "&#FF0000Information:"
      - "&#FF0000¦ &fGo one page back."
      - ""
      - "&#FF0000▷ &n&lCLICK&r&#FF0000 To Navigate"

  return:
    slot: 22
    material: GUSTER_BANNER_PATTERN
    name: "&#FFD900&lRETURN BACK"
    lore:
      - "&8Description"
      - ""
      - "&#FFD900Information:"
      - "&#FFD900¦ &fGo back to the"
      - "&#FFD900¦ &f&#FFD900shop menu&f."
