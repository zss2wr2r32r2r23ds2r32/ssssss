# The gear shop. Its icon and its slot in the main menu sit in ../config.yml
# enchantments: takes name:level, the level may go past the vanilla limit.
# flight: sets the flight duration of a firework rocket.

menu:
  title: "&8Shop Menu | Gear"
  rows: 5
  pages: 1

# Shorter than the shared one, the enchantments and the armour values
# already stand in the tooltip. An empty name keeps the vanilla one.
item-template:
  name: ""
  lore:
    - ""
    - "&#99ff00&l$&r &fPrice &7▷ &#99ff00$&r&#99ff00%price%"
    - ""
    - "&#99ff00▷ &n&lCLICK&r&#99ff00 To Buy"

buttons:

  previous:
    slot: 39
    material: RED_STAINED_GLASS_PANE
    name: "&#FF0000&lPREVIOUS PAGE"
    lore:
      - "&8Description"
      - ""
      - "&#FF0000Information:"
      - "&#FF0000¦ &fGo one page back."
      - ""
      - "&#FF0000▷ &n&lCLICK&r&#FF0000 To Navigate"

  return:
    slot: 40
    material: GUSTER_BANNER_PATTERN
    name: "&#FFD900&lRETURN BACK"
    lore:
      - "&8Description"
      - ""
      - "&#FFD900Information:"
      - "&#FFD900¦ &fGo back to the"
      - "&#FFD900¦ &f&#FFD900shop menu&f."
      - ""
      - "&#FFD900▷ &n&lCLICK&r&#FFD900 To Return"

  next:
    slot: 41
    material: LIME_STAINED_GLASS_PANE
    name: "&#99ff00&lUPCOMING PAGE"
    lore:
      - "&8Description"
      - ""
      - "&#99ff00Information:"
      - "&#99ff00¦ &fGo one page forward."
      - ""
      - "&#99ff00▷ &n&lCLICK&r&#99ff00 To Navigate"

