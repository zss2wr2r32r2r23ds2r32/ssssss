# Crate GUIs, keys, and messages.
# Placeholders (new crates work automatically):
#   %shardedcore_keys_<crateid>%
#   %shardedcore_crate_keys_<crateid>%
#   %shardedcore_key_<crateid>%
edit-title: "&8Edit %crate%"
preview-title: "&8Preview %crate%"
open-title: "&8%crate%"
punch-expire-seconds: 15

# Reward items only sit in this inner window. The border stays empty / filler.
area: [10, 11, 12, 13, 14, 15, 16,
       19, 20, 21, 22, 23, 24, 25,
       28, 29, 30, 31, 32, 33, 34]
filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "
  lore: []

selected:
  material: LIME_STAINED_GLASS_PANE
  name: "&#94FF00&lSELECTED"
  lore:
    - "&8Description"
    - ""
    - "&#94FF00Information:"
    - "&#94FF00| &fYou Have selected"
    - "&#94FF00| &fThis item"
    - ""
    - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Unselect"
    - "&#94FF00▷ &n&lCLOSE&r&#94FF00 To Claim"

claimed:
  material: GRAY_STAINED_GLASS_PANE
  name: "&#8B8B8B&lCLAIMED"
  lore:
    - "&8Description"
    - ""
    - "&#8B8B8BInformation:"
    - "&#8B8B8B| &fYou already claimed"
    - "&#8B8B8B| &fThis item"

sounds:
  edit:
    enabled: true
    sound: "block.chest.open"
    volume: 1.0
    pitch: 1.2
  preview:
    enabled: true
    sound: "block.ender_chest.open"
    volume: 1.0
    pitch: 1.0
  open:
    enabled: true
    sound: "block.chest.open"
    volume: 1.0
    pitch: 1.0
  select:
    enabled: true
    sound: "ui.button.click"
    volume: 1.0
    pitch: 1.4
  confirm:
    enabled: true
    sound: "entity.player.levelup"
    volume: 0.8
    pitch: 1.4
  add:
    enabled: true
    sound: "entity.item.pickup"
    volume: 1.0
    pitch: 1.2
  remove:
    enabled: true
    sound: "entity.item.break"
    volume: 0.6
    pitch: 1.4
  place:
    enabled: true
    sound: "block.stone.place"
    volume: 1.0
    pitch: 1.0
  unplace:
    enabled: true
    sound: "block.stone.break"
    volume: 1.0
    pitch: 1.0
  deny:
    enabled: true
    sound: "entity.villager.no"
    volume: 1.0
    pitch: 1.0

