# The sell multiplier. false hides the button, the last row of the
# sell menu is then only filler and everybody sells at 1.0x.
enabled: true

# BASE counts the plain worth of what you sold, PAID counts the money you got.
# BASE means the goals below are exactly the goods you have to sell.
progress-counts: BASE

menu:
  title: "&8Sell Menu | Sell Multi"
  rows: 6

info:
  slot: 1
  material: EMERALD
  name: "&#80ee0b&lSELL MULTIPLIER"
  lore:
    - "&8Description"
    - ""
    - "&#80ee0bInformation:"
    - "&#80ee0b| &fSell items to level"
    - "&#80ee0b| &fyour own &#80ee0bmultiplier&f."
    - ""
    - "&#80ee0b☀ &fYours: &#80ee0b%multi%x"
    - "&#80ee0b🌊 &fSold: &#80ee0b$%total%"
    - ""
    - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0For Prices"

return:
