      - "&#80ee0b| &fsell &#80ee0bmultiplier&f."
      - ""
      - "&#80ee0b☀ &fSell Multi: &#80ee0b%multi%x"
      - "&#80ee0b🌊 &fUnlocked at: &#80ee0b$%goal%"

  current:
    material: MINECART
    name: "&#FFD900&lSELL PROGRESS"
    lore:
      - "&8Description"
      - ""
      - "&#FFD900Information:"
      - "&#FFD900| &fYou are leveling this"
      - "&#FFD900| &fmulti, it unlocks &#FFD900soon&f."
      - ""
      - "&#FFD900★ &fSell Multi: &#FFD900%multi%x"
      - "&#FFD900☀ &fPercentage: &#FFD900%percent%%"
      - "&#FFD900☀ &fProgress: &#FFD900$%total%&7/&#FFD900$%goal%"

  locked:
    material: MINECART
    name: "&#FF0000&lNOT REACHED"
    lore:
      - "&8Description"
      - ""
      - "&#FF0000Information:"
      - "&#FF0000| &fBelow you can find the"
      - "&#FF0000| &frequirements to &#FF0000unlock&f."
      - ""
      - "&#FF0000★ &fSell Multi: &#FF0000%multi%x"
      - "&#FF0000☀ &fProgress: &#FF0000$%total%&7/&#FF0000$%goal%"

