config-version: 2
message-mode: inherit
menu-rows: 3
filler-material: BLACK_STAINED_GLASS_PANE
custom-apply-command: 'namecolor:gradient %gradient%'

placeholders:
  owned-yes: '&#9FFF00&nYes'
  owned-no: '&#FF2727&nNo'
  none: '&7None'

reset:
  slot: 4
  command: 'namecolor:namecolor white'
  display-name: '&c&lRESET NAME COLOUR'
  lore:
    - '&8Description'
    - ''
    - '&7Information:'
    - '&7| &fRemove your name colour'
    - ''
    - '&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Reset'

