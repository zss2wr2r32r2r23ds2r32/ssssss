# One symbol per category, used as %symbol% in the lines below.
symbols:
  by-player: "🗡"
  by-mob: "🏹"
  environment: "☀"

# Credit the killer when the player took damage from them within this many seconds.
combat-tag-seconds: 10

# /deathtoggle
toggle:
  actionbar: false
  shown: "&#FF256E&lDEATH &7▷ &fDeath messages are now shown."
  hidden: "&#FF256E&lDEATH &7▷ &fDeath messages are now hidden."

# %player% = the dead player, %killer% = the player or mob that killed them.
# An empty line means no message for that cause. Missing causes fall back to default.

by-player:
  entity-attack: "&#FF256E%symbol%  &#FF256E%player% &fwas slain by &#FF256E%killer%"
