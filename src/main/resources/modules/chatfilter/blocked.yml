# Rules are checked in the order they stand here, the first hit decides.
#
# Every rule runs three times. Once on the raw message. Once on a normalised
# copy where accents, look-alike letters from other alphabets and leetspeak
# (4 a, 3 e, 1 i, 0 o, $ s, @ a and eleven more) are folded back to plain
# letters and every other character becomes a word break. And once on a copy
# where short pieces are glued back together, so f u c k reads as one word
# again while who read stays two.
#
# action  REPLACE masks the hit, CANCEL drops the message, WARN only reports.
# alert   sends it to everyone with shardedcore.chatfilter.alerts
# bypass  a permission that skips this rule, empty means nobody skips it
#
# /chatfilter regex <word> writes a new pattern in here for you.
# /chatfilter test <message> shows which rule would catch a message.

rules:

  ADVERTISING:
    enabled: true
    action: CANCEL
    alert: true
    bypass: "shardedcore.chatfilter.bypass.advertising"
    patterns:
      - "(?<![\\p{L}\\p{N}.])(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])([.,_-])(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\2(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\2(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?![\\p{L}\\p{N}.])"
      - "(?<![\\p{L}\\p{N}])[\\p{L}\\p{N}][\\p{L}\\p{N}-]{1,30}+\\.(com|net|org|de|eu|gg|io|me|xyz|club|shop|fun|online|store|site|top|pro|live|tv|co|uk|nl|pl|ru|info|link|space|world)(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])[\\p{L}\\p{N}][\\p{L}\\p{N}-]{1,30}+[\\s(\\[]+d+o+t+[\\s)\\]]+(com|net|org|de|eu|gg|io|me|xyz|club|shop|fun|online|store|site|top|pro|live|tv|co|uk|nl|pl|ru|info|link|space|world)(?![\\p{L}\\p{N}])"

  LINKS:
    enabled: true
    action: CANCEL
    alert: true
    bypass: "shardedcore.chatfilter.bypass.links"
    patterns:
      - "(?<![\\p{L}\\p{N}])https?\\s?:\\s?//\\S+"
      - "(?<![\\p{L}\\p{N}])www\\s?\\.\\s?\\S+"
      - "(?<![\\p{L}\\p{N}])discord\\.gg(?![\\p{L}\\p{N}])"

  SLURS:
    enabled: true
    action: CANCEL
    alert: true
    bypass: ""
    patterns:
      - "(?<![\\p{L}\\p{N}])n+i+g+g+(?:e+r+|a+)(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])f+a+g+g+o+t+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])t+r+a+n+n+y+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])r+e+t+a+r+d+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"

  PROFANITY:
    enabled: true
    action: REPLACE
    alert: false
    bypass: ""
    patterns:
      - "(?<![\\p{L}\\p{N}])f+u+c+k+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])s+h+i+t+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])b+i+t+c+h+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])a+s+s+h+o+l+e+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])b+a+s+t+a+r+d+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])c+u+n+t+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])w+h+o+r+e+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])s+l+u+t+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])w+a+n+k+e+r+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
      - "(?<![\\p{L}\\p{N}])d+i+c+k+h+e+a+d+(?:s|es|ed|er|ers|ing|in|y|z|a)?(?![\\p{L}\\p{N}])"
