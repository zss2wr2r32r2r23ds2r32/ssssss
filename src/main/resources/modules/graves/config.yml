# Grant sharded.graves.use to ranks via LuckPerms — victim must have this permission.
# When they die, items go into a player-head grave for 5 minutes instead of dropping.
# /lp group vip permission set sharded.graves.use true

enabled-worlds: []
expire-seconds: 300
drop-items-on-expire: true
protect-seconds: -1
store-xp: true
hologram-height: 1.6
gui-title: '&8Grave of &f%player%'
