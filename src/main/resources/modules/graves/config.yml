# sharded.graves.use = skip graves (normal drops). Grant to paid ranks.
# Everyone else gets a grave. Anyone can open any grave.

config-version: 3
# message-mode: inherit  # chat | actionbar | both — overrides global message-mode
enabled-worlds: []
expire-seconds: 300
drop-items-on-expire: true
store-xp: true
hologram-height: 1.6
gui-title: '&8Grave of &f%player%'

# Longer grave time — grant permission to rank groups (highest value wins).
duration-permissions:
  'sharded.graves.duration.vip': 600
  'sharded.graves.duration.mvp': 900
  'sharded.graves.duration.ruby': 1200
  'sharded.graves.duration.sapphire': 1500
  'sharded.graves.duration.onyx': 1800
  'sharded.graves.duration.aether': 2400
  'sharded.graves.duration.flawless': 3600
