# Join Messages Module

enabled: true

set-adventure-mode: true
disable-vanilla-join-message: true
disable-vanilla-quit-message: true

join-title:
  enabled: true
  text: "&#AD4EFF&lWelcome &#AD4EFF%player%"
  subtitle: "&7Use command &f/server <name> &7to get started"
  admin-subtitle: "&7Use &f/fly &7to toggle flight"
  fade-in: 10
  stay: 60
  fade-out: 10

admin-fly:
  enabled: true
  permission: shardedlobbycore.fly
  enable-on-join: false
  messages:
    enabled: "%prefix% &aFlight enabled."
    disabled: "%prefix% &cFlight disabled."

chat-message:
  enabled: true
  first-join:
    - ""
    - "&b&lShardedMC Network"
    - ""
    - "&aWelcome &f%player%&a!"
    - "&7Use command: &f/server <name>"
    - ""
  returning:
    - ""
    - "&b&lShardedMC Network"
    - ""
    - "&7Welcome Back &f%player%"
    - "&7Use command: &f/server <name>"
    - ""

broadcast-first-join:
  enabled: true
  message: "#45FF17+ &f%player%"

broadcast-join:
  enabled: true
  message: "&a+ &7%player%"

broadcast-quit:
  enabled: true
  message: "#FF0000- &f%player%"
