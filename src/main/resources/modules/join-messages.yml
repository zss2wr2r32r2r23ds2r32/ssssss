# Join Messages Module

enabled: true

set-adventure-mode: true
disable-vanilla-join-message: true
disable-vanilla-quit-message: true

variables:
  text-primary: "&f"
  text-secondary-discord: "&#3091DB"
  text-secondary-store: "&#FFB600"
  discord-url: "discord.gg/shardedmc"
  store-url: "store.shardedmc.net"
  store-title-color: "&#FFB600"

join-title:
  enabled: true
  text: "&#AD4EFF&lWelcome &#AD4EFF%player%"
  subtitle: "&fUse command &#AD4EFF/server <name> &fto get started"
  fade-in: 10
  stay: 60
  fade-out: 10

first-join:
  title:
    enabled: true
    text: "&#AD4EFF&lWelcome &#AD4EFF%player%"
    subtitle: "&fWe are glad to have you at our network!"
  broadcast:
    enabled: true
    message: "&#FF005D&lNEW &8▷ &7Welcome %player% to ShardedMC you are &8[#%number%]!"
  chat:
    enabled: true
    lines:
      - ""
      - "&#AD4EFF&lShardedMC &#AD4EFFNetwork"
      - ""
      - "&fWelcome &#AD4EFF%player%&f! We are glad to have you at our network!"
      - "&fUse command: &#AD4EFF/server <name> &fTo Get Started!"
      - ""
      - "{@store-title-color}&lSTORE &8▷ {@text-primary}<link:https://{@store-url}>{@store-url}</link>"
      - "<#3091DB>&lDISCORD &8▷ {@text-primary}<link:https://{@discord-url}>{@discord-url}</link>"
      - ""

admin-fly:
  enabled: true
  permission: shardedlobbycore.fly
  enable-on-join: false
  messages:
    enabled: "%prefix% &#9FFF00Flight enabled."
    disabled: "%prefix% &#FF2727Flight disabled."

chat-message:
  enabled: true
  first-join:
    - ""
    - "&#AD4EFF&lShardedMC &#AD4EFFNetwork"
    - ""
    - "&fWelcome &#AD4EFF%player% Please do the following:"
    - "&fUse command: &#AD4EFF/server <name> &fTo Get Started!"
    - ""
    - "{@store-title-color}&lSTORE &8▷ {@text-primary}<link:https://{@store-url}>{@store-url}</link>"
    - "<#3091DB>&lDISCORD &8▷ {@text-primary}<link:https://{@discord-url}>{@discord-url}</link>"
    - ""
  returning:
    - ""
    - "&#AD4EFF&lShardedMC &#AD4EFFNetwork"
    - ""
    - "&#AD4EFF| &fWelcome Back &#AD4EFF%player%"
    - "&#AD4EFF| &fUse command: &#AD4EFF/server <name> &fTo Get Started"
    - ""
    - "{@store-title-color}&lSTORE &8▷ {@text-primary}<link:https://{@store-url}>{@store-url}</link>"
    - "<#3091DB>&lDISCORD &8▷ {@text-primary}<link:https://{@discord-url}>{@discord-url}</link>"
    - ""

broadcast-first-join:
  enabled: false
  message: "#45FF17+ &f%player%"

broadcast-join:
  enabled: false
  message: "#45FF17+ &f%player%"

broadcast-quit:
  enabled: true
  message: "#FF0000- &f%player%"
