      material: RED_BED
      name: "&#A370EE&lNO PERMISSION"
      lore:
        - "&8Description"
        - ""
        - "&#A370EEInformation:"
        - "&#A370EE¦ &fBuy a higher rank on"
        - "&#A370EE¦ &four store for more homes."
