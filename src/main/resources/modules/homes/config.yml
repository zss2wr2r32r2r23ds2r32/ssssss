homes: 14
default-homes: 3

delay-seconds: 5
cancel-on-move: true
confirm-delete: true

# Send the messages to the actionbar instead of the chat.
actionbar: true

sounds:
  countdown:
    enabled: true
    sound: "block.note_block.pling"
    volume: 0.7
    pitch: 1.0
  complete:
    enabled: true
    sound: "entity.enderman.teleport"
    volume: 1.0
    pitch: 1.0
  cancel:
    enabled: true
    sound: "entity.villager.no"
    volume: 1.0
    pitch: 1.0

# No homes can be set in these worlds.
disabled-worlds:
  - "spawn"

gui:
  title: "&8Homes"
  size: 54
  open-sound:
    enabled: true
    sound: "block.barrel.open"
    volume: 0.7
    pitch: 1.2
  click-sound:
    enabled: true
    sound: "block.tripwire.click_on"
    volume: 0.7
    pitch: 1.2

  # Shown in every slot the player has run out of allowance for. One block for all of them, so
  # it names no slot of its own - that comes from the home standing there.
