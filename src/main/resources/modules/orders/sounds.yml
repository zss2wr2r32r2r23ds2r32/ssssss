# Played on a click, on a refusal, when a delivery is made and when one arrives.
click:
  enabled: true
  sound: entity.chicken.egg
  volume: 1.0
  pitch: 2.0
error:
  enabled: true
  sound: block.anvil.place
  volume: 1.0
  pitch: 2.0
delivered:
  enabled: true
  sound: entity.item.pickup
  volume: 1.0
  pitch: 0.5
received:
  enabled: true
  sound: entity.villager.yes
  volume: 1.0
  pitch: 1.2
