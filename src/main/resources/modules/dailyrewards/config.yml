config-version: 1
message-mode: chat
cooldown-hours: 24
spin-ticks: 40
spin-format: '&dSpinning... &f%reward% &8[%rarity%&8]'

sounds:
  spin: UI_BUTTON_CLICK
  win: ENTITY_PLAYER_LEVELUP

rewards:
  tokens_small:
    display: '100 Tokens'
    rarity-label: 'Common &8[40%]'
    weight: 40
    commands:
      - 'tokens give %player% 100'
  tokens_medium:
    display: '250 Tokens'
    rarity-label: 'Uncommon &8[25%]'
    weight: 25
    commands:
      - 'tokens give %player% 250'
  tokens_large:
    display: '500 Tokens'
    rarity-label: 'Rare &8[15%]'
    weight: 15
    commands:
      - 'tokens give %player% 500'
  shard_key:
    display: '1 Shard Key'
    rarity-label: 'Epic &8[10%]'
    weight: 10
    commands:
      - 'crate key give %player% shard 1'
  craft_day:
    display: '/craft for 1 day'
    rarity-label: 'Legendary &8[10%]'
    weight: 10
    commands:
      - 'lp user %player% permission settemp sharded.craft.use true 1d'
