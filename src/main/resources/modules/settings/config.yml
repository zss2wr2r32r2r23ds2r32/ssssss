# Used when an entry has no lore of its own.
# %color% %description% %command% %status% %click%
lore:
  - "&8Description"
  - ""
  - "%color%Information:"
  - "%color%| &fClick To"
  - "%color%| &f%description%"
  - ""
  - "%color%ℹ &fCommand: %color%%command%"
  - "%color%⚓ &fCurrently: %status%"
  - ""
  - "%click%"

defaults:
  chat: true
  msg: true
  live: true
  tpa: true
  tpahere: true
  joinleave: true
  mobs: true
  death: true
  pay: true
  nightvision: false
  bossbar: true
  scoreboard: true
  tpauto: false
  coinflip: true
  crystal: true
  rtpqueue: true

open-sound:
  sound: ui.button.click
  volume: 1
  pitch: 1

mob-radius: 50

entries:
  chat:
    command: "/chattoggle"
    material: PAPER
    name: "&#FF0000&lPUBLIC CHAT"
    description: "Toggle Public Chat"
  msg:
    command: "/msgtoggle"
    material: WRITABLE_BOOK
    name: "&#FFF800&lPRIVATE MESSAGES"
    description: "Toggle Private Messages"
  live:
    command: "/livetoggle"
    material: SPYGLASS
    name: "&#FF0072&lLIVE MESSAGES"
    description: "Toggle Live Messages"
  tpa:
    command: "/tpatoggle"
    material: ENDER_PEARL
    name: "&#008DFF&lTPA REQUESTS"
    description: "Toggle TPA Requests"
  tpahere:
    command: "/tpaheretoggle"
    material: CHORUS_FRUIT
    name: "&#FF6700&lTPA HERE"
    description: "Toggle TPA Here Requests"
  joinleave:
    command: "/joinleavetoggle"
    material: OAK_DOOR
    name: "&#004FFF&lJOIN / LEAVE"
    description: "Toggle Join And Leave Messages"
  mobs:
    command: "/mobspawning"
    material: ZOMBIE_HEAD
    name: "&#94FF00&lMOB SPAWNING"
    description: "Toggle Mobs Near You"
  death:
    command: "/deathtoggle"
    material: SKELETON_SKULL
    name: "&#FF0000&lDEATH MESSAGES"
    description: "Toggle Death Messages"
  pay:
    command: "/paytoggle"
    material: GOLD_INGOT
    name: "&#E7FF00&lPAYMENTS"
    description: "Toggle Incoming Payments"
  nightvision:
    command: "/nvtoggle"
    material: GOLDEN_CARROT
    name: "&#00CBFF&lNIGHT VISION"
    description: "Toggle Night Vision"
  bossbar:
    command: "/tab bossbar toggle"
    material: DRAGON_HEAD
    name: "&#9F00FF&lTAB BOSSBAR"
    description: "Toggle The TAB Bossbar"
  scoreboard:
    command: "/tab scoreboard toggle"
    material: PAINTING
    name: "&#0079FF&lTAB SCOREBOARD"
    description: "Toggle The TAB Scoreboard"
  tpauto:
    command: "/tpauto"
    material: RECOVERY_COMPASS
    name: "&#9FFF00&lTPA AUTO ACCEPT"
    description: "Automatically Accept TPA"
  coinflip:
    command: "/cf toggle"
    material: SUNFLOWER
    name: "&#E7FF00&lCOINFLIP MESSAGES"
    description: "Toggle Coinflip Messages"
  crystal:
    command: "/crystaltoggle"
    material: END_CRYSTAL
    name: "&#FF005D&lFAST CRYSTAL"
    description: "Toggle Fast Crystal"
  rtpqueue:
    command: "/rtpqueuetoggle"
    material: ENDER_PEARL
    name: "&#22AFFB&lRTP QUEUE MESSAGES"
    description: "Toggle RTP Queue Messages"

