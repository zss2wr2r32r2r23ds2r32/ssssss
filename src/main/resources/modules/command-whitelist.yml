# Command Whitelist Module
# Blocks ALL commands for members unless listed below

enabled: true
filter-tab-complete: true
filter-command-send: true
filter-brigadier-suggestions: true
bypass-for-op: true

whitelist:
  - "server"
  - "servers"
  - "spawn"
  - "msg"
  - "tell"
  - "r"
  - "fly"
  - "ajparkour"
  - "music"
  - "discord"
  - "store"

message: "%prefix% &#FF2727You cannot use that command in the lobby."
