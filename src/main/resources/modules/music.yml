# Music Module
# Opens a GUI to play songs via configurable commands

enabled: true
run-as-console: false

gui:
  title: "Music Player"
  rows: 6

commands:
  play: "music play %song%"
  stop: "music stop"
  pause: "music pause"
  random: "music random"
  skip: "music skip"

action-bar:
  enabled: true
  update-interval-ticks: 40
  format: "&#FF0072&lMUSIC &8▷ &fUp Next is: &#FF0072%song%"
  empty: "None"

playlist-gui:
  title: "&#FF0072Playlist"
  rows: 6
  confirm-slot: 49
  play-slot: 48
  summary-slot: 50
  summary-material: BOOK
  summary-name: "&#FF0072&lYOUR PLAYLIST"
  summary-line-format: "&#FF0072#%number% &f%song%"
  summary-empty-name: "&7No songs selected"
  summary-empty-lore:
    - "&7Select songs on the left"
  saved-message: "%prefix% &#94FF00Your playlist has been saved!"
  selected-name: "&#94FF00Selected &7(#%number%)"
  selected-lore:
    - "&8Description"
    - ""
    - "&#94FF00Information:"
    - "&#94FF00| &fThe Song %song%"
    - "&#94FF00| &fIs now added to your Playlist!"
    - ""
    - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Cancel"
  confirm-name: "&#94FF00&lCONFIRM"
  confirm-lore:
    - "&8Description"
    - ""
    - "&#94FF00| &fClick to save your"
    - "&#94FF00| &fplaylist in order"
    - ""
    - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Save"
  play-name: "&#FF0072&lPLAY PLAYLIST"
  play-lore:
    - "&8Description"
    - ""
    - "&#FF0072| &fPlay your saved playlist"
    - "&#FF0072| &ffrom the beginning"
    - ""
    - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Play"
  selected-material: LIME_STAINED_GLASS_PANE
  summary-empty-lore:
    - "&7Select songs on the left"
  empty-message: "%prefix% &#FF2727Select at least one song for your playlist."
  no-saved-message: "%prefix% &#FF2727You don't have a saved playlist. Select songs and confirm first."

playlist-queue:
  play-delay-ticks: 5

filler:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

