# The three giveaway menus. All of them are six rows.
# Entries sit in the inner window, the border stays empty.

title: "&8Public Giveaways"
time-format: "dd.MM.yyyy HH:mm"

# 28 places per page. Filled from the top left.
area: [10, 11, 12, 13, 14, 15, 16,
       19, 20, 21, 22, 23, 24, 25,
       28, 29, 30, 31, 32, 33, 34,
       37, 38, 39, 40, 41, 42, 43]

# Everything that is not an entry and not a button.
filler:
  material: BLACK_STAINED_GLASS_PANE
  name: " "
  lore: []

# How many prize lines fit in a lore before it cuts off.
prize-lines: 10
prize-format: "&#FFB02E¦ &f%amount%x &#FFB02E%item%"
prize-more: "&#FFB02E¦ &fand %rest% more"

main:

  entry:
    material: CHEST_MINECART
    name: "&#FFB02E&l%player%'S GIVEAWAY"
    lore:
      - "&8Description"
      - ""
      - "&#FFB02EInformation:"
      - "&#FFB02E¦ &fEnter %player%'s"
      - "&#FFB02E¦ &fongoing &#FFB02Egiveaway&f."
      - ""
      - "&#FFB02EPrizes:"
      - "&#FFB02E¦ &f%items%"
      - ""
