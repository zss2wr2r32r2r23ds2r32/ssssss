# PvP Module

enabled: true

hold-seconds: 5

action-bar:
  enter: "&#FF0000Entering PvP in &f%seconds%s"
  leave: "&#22FF00Leaving PvP in &f%seconds%s"

enter-item:
  material: DIAMOND_SWORD
  name: "&#FF0000&lPVP SWORD"
  lore:
    - "&8Description"
    - ""
    - "&7Hold To PVP"

leave-item:
  material: WOODEN_SWORD
  name: "&#22FF00&lLEAVE PVP"
  lore:
    - "&8Description"
    - ""
    - "&7Hold to leave PvP"

messages:
  entered: "%prefix% &#FF0000You have entered PvP mode, you may fight!"
  left: "%prefix% &#22FF00You have left PvP mode, PvP is now disabled."

kit:
  armor:
    helmet:
      material: DIAMOND_HELMET
    chestplate:
      material: DIAMOND_CHESTPLATE
    leggings:
      material: DIAMOND_LEGGINGS
    boots:
      material: DIAMOND_BOOTS
  items:
    sword:
      slot: 0
      material: DIAMOND_SWORD
      name: "&#FF0000&lPVP SWORD"
      lore:
        - "&8Description"
        - ""
        - "&7PvP Sword"
      enchantments:
        sharpness: 4
    golden-apples:
      slot: 2
      material: GOLDEN_APPLE
      amount: 8
      name: "&6Golden Apples"
      lore:
        - "&8Description"
        - ""
        - "&7Golden Apples"
    bow:
      slot: 3
      material: BOW
      name: "&#4498DB&lPVP BOW"
      lore:
        - "&8Description"
        - ""
        - "&7PvP Bow"
      enchantments:
        infinity: 1
    leave-sword:
      slot: 8
      material: WOODEN_SWORD
      name: "&#22FF00&lLEAVE PVP"
      lore:
        - "&8Description"
        - ""
        - "&7Hold for &f5 seconds &7to leave PvP."
      unbreakable: true
