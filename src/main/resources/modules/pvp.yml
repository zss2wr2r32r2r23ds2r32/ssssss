# PvP Module
# Hold the enter sword for 5 seconds to enter PvP
# Switch slots cancels the timer
# Hold the leave sword for 5 seconds to exit PvP

enabled: true

hold-seconds: 5

action-bar:
  enter: "&#FF0000Entering PvP in &f%seconds%s"
  leave: "&#22FF00Leaving PvP in &f%seconds%s"

enter-item:
  material: DIAMOND_SWORD
  name: "&#FF0000&lPVP SWORD"

leave-item:
  material: WOODEN_SWORD
  name: "&#22FF00&lLEAVE PVP"

messages:
  entered: "&#FF0000You have entered PvP mode, you may fight!"
  left: "&#22FF00You have left PvP mode, PvP is now disabled."

kit:
  armor:
    helmet:
      material: DIAMOND_HELMET
    chestplate:
      material: DIAMOND_CHESTPLATE
    leggings:
      material: DIAMOND_LEGGINGS
    boots:
      material: DIAMOND_BOOTS
  items:
    sword:
      slot: 0
      material: DIAMOND_SWORD
      name: "&#FF0000&lPVP SWORD"
      enchantments:
        sharpness: 4
      unbreakable: true
    golden-apples:
      slot: 2
      material: GOLDEN_APPLE
      amount: 8
      name: "&6Golden Apples"
    bow:
      slot: 3
      material: BOW
      name: "&#4498DB&lPVP BOW"
      enchantments:
        infinity: 1
      unbreakable: true
    leave-sword:
      slot: 8
      material: WOODEN_SWORD
      name: "&#22FF00&lLEAVE PVP"
      lore:
        - "&7Hold for &f5 seconds &7to leave PvP."
        - ""
        - "&#FFD900▷ &n&lHOLD&#FFD900 To Leave PvP"
      unbreakable: true
