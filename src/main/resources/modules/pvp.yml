        sharpness: 4
    golden-apples:
      slot: 2
      material: GOLDEN_APPLE
      amount: 8
      name: "&6Golden Apples"
      lore:
        - "&8Description"
        - ""
        - "&7Golden Apples"
    bow:
      slot: 3
      material: BOW
      name: "&#4498DBPvP Bow"
      lore:
        - "&8Description"
        - ""
        - "&7PvP Bow"
      enchantments:
