# ticks between updates. Ride keeps the tag glued, so this only refreshes text.
refresh: 1

display:
  background: '#00000000'
  brightness: 15
  view-distance: 64
  scale: 1.0
  y-offset: 0.22
  line-gap: 0.24
  line-width: 1000
  text-opacity: 255
  see-through: false
  shadow: true
  hide-when-sneaking: true
  hide-when-invisible: true
  hide-own: false
  ride: false
  teleport-duration: 1

disabled-worlds: []

# interval is how long a frame stands, refresh how often the row is looked at. both in ticks,
# 20 is a second, and interval rounds up to a multiple of refresh. interval 0 never turns over.
lines:

  top:
    enabled: true
    interval: 0
    refresh: 100
    frames:
      - '%luckperms_prefix%&f%player_name%%shardedcore_tag% %luckperms_suffix%'

  bottom:
    enabled: true
    interval: 80
    refresh: 40
    frames:
      - '&#80ee0b&l$&r &#80ee0b%shardedcore_money_formatted% &7| &#F47714⚑ &#F47714%shardedcore_team% &7| &#0AACE6☀ &#0AACE6%shards_value_formatted%'
      - '&#FF0000🗡 &#FF0000%statistic_player_kills% &7| &#FB7B0B☠ &#FB7B0B%statistic_deaths% &7| &#FFF300⌛ &#FFF300%statistic_time_played%'

messages:
  info: '&#FF256E&lNAMETAGS &8▷ &fLines &#FF256E%lines% &7| &fOffset &#FF256E%offset% &7| &fGap &#FF256E%gap% &7| &fRefresh &#FF256E%refresh%'
  usage: '&#FF256E&lNAMETAGS &8▷ &fUse &#FF256E/nametags reload &fafter changing the file.'
  reloaded: '&#FF256E&lNAMETAGS &8▷ &fReloaded, &#FF256E%count% &ftags rebuilt.'
