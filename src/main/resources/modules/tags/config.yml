config-version: 1

menu-title: 'Tags'
menu-size: 27
limited-menu-title: 'Limited Time Tags'
limited-menu-size: 27
limited-close-slot: 26

apply-command: 'eternaltags set %tag_id%'
custom-apply-command: 'eternaltags set %custom%'

owned:
  show-in-lore: true
  yes: '&#9FFF00Yes'
  no: '&#FF2727No'
  lore-line: '%color%⚓ &fOwned: %owned%'

close-button:
  enabled: true
  slot: 26
  display-name: '&x&F&F&0&0&0&0&lCLOSE'

limited-button:
  enabled: true
  slot: 22
  material: CLOCK
  display-name: '&x&F&F&0&0&0&0&lLIMITED TIME'
  lore:
    - '&8Limited Tags'
    - ''
    - '&x&F&F&0&0&0&0| &fView limited-time tags'
    - ''
    - '&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Open'

custom-tag-blacklist:
  - badword
  - admin
  - owner
  - nigger
  - faggot

tags:
