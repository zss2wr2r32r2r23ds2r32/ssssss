# Chat tags. Shown in chat and above the nametag.
# /tags opens the GUI. /tag create <name> <tag> makes a new one.
# /tags limited <name> <tag> adds a limited-time tag.
# Placeholder: %shardedcore_tag%

tab:
  enabled: false

chat-format: " %tag%"
tab-format: " %tag%"

tags:
  sharded:
    tag: "&#A370EE&lSHARDED"
    description: "&8Description"
  og:
    tag: "&#FFD900&lOG"
    description: "&8Description"

limited: {}

gui:
  title: "&8Tags"
  limited-title: "&8Limited Tags"
  rows: 6
  default-color: "0083FF"
  default-description: "&8Description"
  item-material: NAME_TAG
  item-name: "%color%&l%name%"
  status-owned: "%color% ☀︎ &fStatus: &#94FF00&nOWNED"
  status-locked: "%color% ☀︎ &fStatus: &#94FF00&nUNLOCK"
  click-footer: "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Equip"
  lore:
    - "%color%&l%name%"
    - "%description%"
    - ""
    - "%color%Information:"
    - "%color%| &fClick to"
    - "%color%| &fEquip %color%%display%"
    - ""
    - "%status%"
    - ""
    - "%click%"
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []
  previous:
    slot: 48
    material: RED_DYE
    name: "&cPrevious page"
    lore:
      - "&7Page %page%"
  next:
    slot: 50
    material: LIME_DYE
    name: "&aNext page"
    lore:
      - "&7Page %page%"
  extra:
    enabled: true
    slot: 49
    material: CLOCK
    name: "&#FFBA00&lLimited Tags"
    lore:
      - "&8Description"
      - ""
      - "&#FFBA00Information:"
      - "&#FFBA00| &fView limited"
      - "&#FFBA00| &ftime tags."
      - ""
      - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To View"

messages:
  usage: "&#A370EE&lTAG &7▷ &f/tag create <name> <tag> &7| &fset <name> &7| &fremove <name>"
  usage-create: "&#A370EE&lTAG &7▷ &f/tag create <name> <tag>"
  usage-set: "&#A370EE&lTAG &7▷ &f/tag set <name>"
  usage-remove: "&#A370EE&lTAG &7▷ &f/tag remove <name>"
  usage-limited: "&#A370EE&lTAG &7▷ &f/tags limited <name> <tag>"
  created: "&#A370EE&lTAG &7▷ &fCreated &#A370EE%name% &fas %tag%&f."
  created-limited: "&#A370EE&lTAG &7▷ &fAdded limited tag &#A370EE%name% &fas %tag%&f."
  set: "&#A370EE&lTAG &7▷ &fYour tag is now %tag%&f."
  removed: "&#A370EE&lTAG &7▷ &fRemoved &#A370EE%name%&f."
  cleared: "&#A370EE&lTAG &7▷ &fYour tag was cleared."
  missing: "&#FF0000&lERROR &7▷ &fUnknown tag &#A370EE%name%&f."
  locked: "&#FF0000&lERROR &7▷ &fYou have not unlocked &#A370EE%name%&f."
  invalid: "&#FF0000&lERROR &7▷ &fThat tag is not valid."
  no-permission: "&#FF0000&lERROR &7▷ &fYou do not have permission."
  players-only: "&#FF0000&lERROR &7▷ &fOnly a player can use that."
