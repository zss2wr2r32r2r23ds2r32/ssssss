config-version: 12
message-mode: chat

menu-title: 'Tags'
menu-size: 54
border-material: GRAY_STAINED_GLASS_PANE
limited-menu-title: 'Limited time tags'
limited-menu-size: 54

custom-cooldown-hours: 24
custom-max-letters: 5
block-limited-tag-copy: true

custom-tag-blacklist:
  - badword
  - admin
  - owner

custom-emoji-blacklist:
  - '🖕'
  - '💩'

placeholders:
  owned-yes: '&#9FFF00&nYes'
  owned-no: '&#FF2727&nNo'
  none: '&7None'
  cooldown-ready: '&#9FFF00Ready'

remove-button:
  enabled: true
  material: FLOWER_CHARGE_BANNER_PATTERN
  display-name: '&x&F&F&B&A&0&0&lRemove Tag'
  lore:
    - '&8Description'
    - ''
    - '&x&F&F&B&A&0&0Information:'
    - '&x&F&F&B&A&0&0| &fClick to remove your current tag'
    - ''
    - '&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&nClick&r &x&F&F&B&A&0&0To Remove'

close-button:
  enabled: true
  nav-override: true
  display-name: '&x&F&F&B&A&0&0&lClose'

back-button:
  nav-override: true
  display-name: '&x&F&F&B&A&0&0&lBack'

limited-button:
  enabled: true
  material: CLOCK
  display-name: '&x&F&F&B&A&0&0&lLimited Time'
  lore:
    - '&8Limited Tags'
    - ''
    - '&x&F&F&B&A&0&0Information:'
    - '&x&F&F&B&A&0&0| &fView limited-time tags'
    - ''
    - '&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&nClick&r &x&F&F&B&A&0&0To Open'

previous-page:
  name: '&ePrevious Page'
next-page:
  name: '&eNext Page'

tags:
  mvp:
    slot: 10
    permission: sharded.tag.mvp
    material: PAPER
    display-name: '&8[&x&F&F&C&F&0&0&lMVP&8]'
    tag-display: '&8[&x&F&F&C&F&0&0&lMVP&8]'
    lore:
      - '&8Description'
      - ''
      - '%accent%Information:'
      - '%accent%| &fEquip this tag.'
      - '%accent%| &fAnd stand out on tab!'
      - ''
      - '%accent%⚓ &fOwned: %tag_owned_mvp%'
      - ''
      - '&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&nClick&r &x&F&F&B&A&0&0To Apply'
