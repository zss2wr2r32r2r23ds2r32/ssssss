config-version: 6

menu-title: 'Tags'
menu-size: 27
limited-menu-title: 'Limited Time Tags'
limited-menu-size: 27
limited-close-slot: 26

apply-command: 'eternaltags:tags set %tag_id% %player_name%'
custom-apply-command: '[console] lp user %player_name% meta setsuffix "%custom%"'
custom-remove-command: '[console] lp user %player_name% meta removesuffix "%custom%"'
custom-cooldown-hours: 24
block-limited-tag-copy: true

clear-equipped-commands:
  - '[console] eternaltags:tags clear %player_name%'
  - '[console] eternaltags tags clear %player_name%'

custom-tag-blacklist:
  - badword
  - admin
  - owner

# Emoji characters blocked from custom tags (emojis are otherwise allowed)
custom-emoji-blacklist:
  - '🖕'
  - '💩'

placeholders:
  owned-yes: '&#9FFF00&nYes'
  owned-no: '&#FF2727&nNo'
  none: '&7None'
  cooldown-ready: '&#9FFF00Ready'

close-button:
  enabled: true
  slot: 26
  display-name: '&x&F&F&0&0&0&0&lCLOSE'

limited-button:
  enabled: true
  slot: 22
  material: CLOCK
  display-name: '&x&F&F&0&0&0&0&lLIMITED TIME'
  lore:
    - '&8Limited Tags'
    - ''
    - '&x&F&F&0&0&0&0| &fView limited-time tags'
    - ''
    - '&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Open'

tags:
  mvp:
    slot: 10
    permission: eternaltags.tag.mvp
    material: PAPER
    display-name: '&8[&x&F&F&C&F&0&0&lMVP&8] &x&F&F&C&F&0&0Tag'
    lore:
      - '&8Description'
      - ''
      - '&x&F&F&C&F&0&0Information:'
      - '&x&F&F&C&F&0&0| &fEquip the &x&F&F&C&F&0&0MVP Tag'
      - '&x&F&F&C&F&0&0| &fAnd Stand out on TAB!'
      - ''
      - '&x&F&F&C&F&0&0⚓ &fOwned: %tag_owned_mvp%'
      - ''
      - '&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Apply'
  diamond:
