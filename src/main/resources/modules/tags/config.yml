# Chat tags. Shown in chat and above the nametag.
# /tags opens the GUI. /tag create <name> <tag> makes a new one.
# /tags limited <name> <tag> adds a limited-time tag.
# Placeholder: %shardedcore_tag%

prefix: "&#A370EE&lTAGS &8▷ &r"

tab:
  enabled: false

chat-format: " %tag%"
tab-format: " %tag%"

tags:
  sharded:
    tag: "&#A370EE☀&#A370EE&lSHARDED"
    description: "&8Description"
  summer:
    tag: "&#FCFF00☀&#FCFF00&lSUMMER"
    description: "&8Description"
  og:
    tag: "&#FFD900☀&#FFD900&lOG"
    description: "&8Description"

limited: {}

gui:
  title: "Name Tags"
  limited-title: "Limited Tags"
  guide: "Name Tags"
  preview-name: "Name Tags"
  rows: 6
  default-color: "A370EE"
  default-description: "&8Description"
  colored-bundles: true
  item-material: BUNDLE
  item-name: "%color%☀%color%&l%name%"
  status-owned: "%color%☀%color%&lSTATUS: &#94FF00&l&nOWNED"
  status-locked: "%color%☀%color%&lSTATUS: &#FF2727&l&nLOCKED"
  click-footer: "&x&F&F&B&A&0&0▷&x&F&F&B&A&0&0&l&nCLICK TO EQUIP"
  lore:
    - "&8Description"
    - ""
    - "%color%&lINFORMATION:"
    - "%color%| &f&lCLICK TO EQUIP"
    - "%color%| &f&lTHIS TAG"
    - ""
    - "%status%"
    - ""
    - "%click%"
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []
  previous:
    slot: 48
  next:
    slot: 50
  back:
    slot: 49
  limited-back:
    slot: 49
  extra:
    enabled: true
    slot: 49
    material: CLOCK
    name: "&#FFBA00&lLIMITED TAGS"
    lore:
      - "&8Description"
      - ""
      - "&#FFBA00&lINFORMATION:"
      - "&#FFBA00| &f&lVIEW LIMITED"
      - "&#FFBA00| &f&lTIME TAGS"
      - ""
      - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK TO VIEW"
  clear:
    enabled: true
    slot: 4
    material: BARRIER
    name: "&#FF0000&lCLEAR TAG"
    lore:
      - "&8Description"
      - ""
      - "&#FF0000&lINFORMATION:"
      - "&#FF0000| &f&lDONT WANT A TAG?"
      - ""
      - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK TO REMOVE"

sounds:
  open:
    enabled: true
    sound: "ui.button.click"
    volume: 0.6
    pitch: 1.2
  click:
    enabled: true
    sound: "ui.button.click"
    volume: 0.5
    pitch: 1.0
  equip:
    enabled: true
    sound: "item.armor.equip_leather"
    volume: 0.8
    pitch: 1.2
  error:
    enabled: true
    sound: "block.note_block.bass"
    volume: 0.7
    pitch: 0.8

messages:
  usage: "%prefix%&f/tag create <name> <tag> &8| &fset <name> &8| &fremove <name>"
  usage-create: "%prefix%&f/tag create <name> <tag>"
  usage-set: "%prefix%&f/tag set <name>"
  usage-remove: "%prefix%&f/tag remove <name>"
  usage-limited: "%prefix%&f/tags limited <name> <tag>"
  created: "%prefix%&fCreated &#A370EE%name% &fas %tag%&f."
  created-limited: "%prefix%&fAdded limited tag &#A370EE%name% &fas %tag%&f."
  set: "%prefix%&fYour tag is now %tag%&f."
  removed: "%prefix%&fRemoved &#A370EE%name%&f."
  cleared: "%prefix%&fYour tag was cleared."
  missing: "&#FF0000&lERROR &8▷ &fUnknown tag &#A370EE%name%&f."
  locked: "&#FF0000&lERROR &8▷ &fYou have not unlocked &#A370EE%name%&f."
  invalid: "&#FF0000&lERROR &8▷ &fThat tag is not valid."
  no-permission: "&#FF0000&lERROR &8▷ &fYou do not have permission."
  players-only: "&#FF0000&lERROR &8▷ &fOnly a player can use that."
