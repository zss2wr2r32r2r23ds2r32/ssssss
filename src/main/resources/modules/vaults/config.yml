# How many vaults exist in total. 45 is the maximum, that is how many
# permissions the plugin.yml declares.
vaults: 45

# Vaults every player owns without any permission at all.
default-vaults: 0

# Permissions work the same way as homes: shardedcore.vault.10 unlocks vault 1 to 10.
# Losing the permission never deletes anything, the vault just locks again and the
# items wait inside until the rank comes back.
#
# NEVER give out shardedcore.vault.* to a rank. That wildcard also covers
# shardedcore.vault.admin, which opens and edits the vaults of every other player.
# Always give the exact number instead, for example shardedcore.vault.10

# Opening a vault while combat tagged is refused, and a vault that is already open
# closes itself the moment the tag lands.
# shardedcore.combat.bypass ignores both.
block-in-combat: true

# Items that may not be put into a vault. Empty means everything is allowed.
# Only checked when an item goes in, so nothing already stored is ever thrown out.
blocked-materials: []

