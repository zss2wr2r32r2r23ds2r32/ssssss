    display_name: '&x&F&F&0&0&0&0&lRED GLOW'
    lore:
      - '&8Description'
      - ''
      - '&x&F&F&0&0&0&0Information:'
      - '&x&F&F&0&0&0&0| &fPurchase the &x&F&F&0&0&0&0Red Glow'
