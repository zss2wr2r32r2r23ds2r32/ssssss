# Portal RTP
config-version: 4
# message-mode: inherit  # chat | actionbar | both — overrides global message-mode
portal-world: spawn
target-world: world
radius-label: 1K x 1K
border-label: 5k x 5k
gui-cooldown-ms: 2000
countdown-seconds: 5
countdown-actionbar: true
cooldown-seconds: 30

center-x: 0
center-z: 0
min-radius: 100
max-radius: 500
max-attempts: 25

# Portal wand: /rtp wand — right-click a nether portal block to register it.
# If no triggers are set, ANY portal in portal-world works.
