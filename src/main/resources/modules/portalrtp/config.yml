# Portal RTP
config-version: 9
message-mode: chat
portal-world: spawn
# /rtp only works while standing in portal-world (unless sharded.rtp.bypass)
command-require-portal-world: true
target-world: world
radius-label: 1K x 1K
border-label: 5k x 5k
gui-cooldown-ms: 2000
countdown-seconds: 5
cooldown-seconds: 30
countdown-actionbar: '&#9FFF00&lRTP &8▷ &fTeleporting in &#9FFF00&n%seconds%&r&#9FFF00s'
teleport-cancelled-actionbar: '&#9FFF00&lRTP &8▷ &#FF0000&lTeleport Cancelled &8— &fYou Moved.'
countdown-sound: BLOCK_NOTE_BLOCK_PLING
cancel-sound: BLOCK_NOTE_BLOCK_BASS

center-x: 0
center-z: 0
min-radius: 100
max-radius: 500
max-attempts: 25

# Portal wand: /rtp wand — right-click a nether portal block to register it.
# If no triggers are set, ANY portal in portal-world works.
