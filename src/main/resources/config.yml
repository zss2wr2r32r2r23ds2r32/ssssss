# ShardedSMP configuration
world: world
border-size: 1500
border-padding: 16

grace-minutes: 30
grace-steak-amount: 32

obsidian:
  total: 10
  required-players: 5
  phase-two-found: 5
  # Extra wait after grace ends before the first piece can spawn
  first-delay-min-seconds: 90
  first-delay-max-seconds: 240
