  grace-actionbar: "&fGrace ends in &#FF0000%time%"
  holder-actionbar: "&fObsidian Holder &#FF0000%player% &7x%count%"
  ground-actionbar: "&fA Piece of &#FF0000Obsidian &fis still on the ground"
  nether-portal: "&fThe Nether Portal has opened at X%x% y%y% Z%z%"
  end-portal: "&fThe End Portal has spawned at X%x% y%y% Z%z%"
  diamonds-progress: "&bDiamonds &f%current%&7/&f%needed%"
