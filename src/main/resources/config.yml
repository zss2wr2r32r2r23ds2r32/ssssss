# ---------------------------------------------------------
#  ShardedCore - main configuration
# ---------------------------------------------------------

config-version: 4

prefix: '&#00A2FF&lCORE &8▷ &r'

# How module messages are sent: chat | actionbar | both
# Override per module in modules/<name>/config.yml (message-mode: actionbar)
# Override per message in modules/<name>/messages.yml (message-modes.<key>: actionbar)
message-mode: chat

modules:
  craft: true
  fix: true
  trash: true
  chat: true
  privatemessages: true
  nightvision: true
  deathmessages: true
  joinmessages: true
  backpack: true
  graves: true
  armortrims: true
  fly: true
  autosmelt: true
  portalrtp: true
  settings: true
  kill: true
  killstreaks: true
  pets: true
  tempranks: true
  pickupmobs: true
  pickupspawners: true
  tokens: true
  toolname: true
  bundles: true
