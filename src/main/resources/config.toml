# ShardedVelocityCore Configuration

status-refresh-seconds = 1
status-sync-interval-seconds = 1
whitelist-as-maintenance = true
lobby-server = "lobby"

tracked-servers = ["survival", "events", "diasmp"]
queue-servers = ["lobby", "survival", "events", "diasmp"]

maintenance-servers = []

[motd]
center-width = 48
lines = [
  "&#AD4EFF&lSHARDEDMC &8▷ &7[1.21+]",
  "&#FFE300⚓ &#FFE300&lSEASON 1 SOON &#FFE300⚓"
]

[hover]
enabled = false
messages = [
  "",
  "&#AD4EFF&lSHARDEDMC &#AD4EFF&lNetwork &8| &7[1.21+]",
  "",
  "&#AD4EFFɪɴꜰᴏʀᴍᴀᴛɪᴏɴ:",
  "&#FF005D⚓ &fDiscord &8▷ &#FF005Dᴅɪsᴄᴏʀᴅ.ɢɢ/shardedmc",
  "&#9FFF00⛨ &fStore &8▷ &#9FFF00ᴄᴏᴍɪɴɢ sᴏᴏɴ",
  "",
  "&#AD4EFF☀ &fPlay with &#AD4EFF&n{online_players}&f other players"
]

[maintenance-motd]
kick-message = [
  "",
  "&#FF0000&lMAINTENANCE",
  "&fTHIS SERVER IS CURRENTLY IN DOWNTIME",
  "",
  "&fIF YOU BELIEVE THERE IS AN ERROR CONTACT STAFF VIA",
  "&#FFD900▷ &n&lDISCORD.GG/SHARDEDMC&f &#FFD900◁"
]
protocol-text = true
text = "MAINTENANCE"
protocol-version = -1

[queue]
  action-bar = "&#4498DB#%numberinqueue% in queue to &n%server_color%%server%&r &7(Wating: %numberofpeoplewaitinginqueue%)"
  prefix = "&#4498DB&lQUEUE &8▷&r "
  default-server = "survival"
  action-bar-interval-ticks = 10

  [queue.colors]
    position = "&#FFFFFF"
    server = "&#8AFF00"
    waiting = "&#AAAAAA"
    success = "&#8AFF00"
    error = "&#FF0000"
    accent = "&#4498DB"

  [queue.server-colors]
    lobby = "&#4498DB"
    survival = "&#8AFF00"
    events = "&#FFEE00"
    diasmp = "&#FF0000"
    diamondsmp = "&#FF0000"

  [queue.max-players]
    lobby = 500
    survival = 100
    events = 200
    diasmp = 150
