# ==========================================================================
#  /settings menus
#  ------------------------------------------------------------------------
#  Every icon below is fully editable: change "slot", "material", "name" and
#  "lore" to rearrange or restyle a menu without touching the plugin.
#
#  Placeholders available in names and lore:
#    %status%   ENABLED / DISABLED, taken from the "status" section below
#    %state%    the same value, if you prefer that name
#    %enabled%  raw true / false
#    %mode%     crystal or diasmp
#    %selected% whether this gamemode / kit / countdown is the selected one
#    %phase%    lobby, countdown, running or ended
#    %alive%    players still alive        %dead%   players eliminated
#    %size%     current world border size  (world-border icon)
#    %seconds%  selected countdown length  (countdown icon)
#    %kit%      selected kit name          (kits icon)
#    %tracked%  player-placed blocks being tracked (clear-blocks icon)
#    %progress% bedrock drop progress percent      (bedrock-drop icon)
#    %count%    supply drops per activation        (supply-drops icon)
#
#  Each icon may carry a "selected:" block. Only the keys you set inside it
#  are used when the entry is selected or enabled, so you can change just the
#  lore and keep the material and name.
#
#  Clicking rules:
#    pvp / locator-bar / spawn-protection   any click flips the toggle
#    everything else                        left click runs it,
#                                           right click flips its toggle
# ==========================================================================

status:
  enabled: '&a&lENABLED'
  disabled: '&c&lDISABLED'
  none: '&7none'

# Background panes, used by every menu unless a menu overrides it.
filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: ' '

# --------------------------------------------------------------------------
#  /settings  -  pick a gamemode
