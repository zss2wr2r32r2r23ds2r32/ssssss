  shardedcore.settings.tpauto:
    default: true
  shardedcore.coinflip:
    default: true
  shardedcore.crates:
    default: true
  shardedcore.crates.admin:
    default: op
  shardedcore.economy.admin:
    default: op
  shardedcore.economy.balance:
    default: true
  shardedcore.economy.pay:
    default: true
  shardedcore.guide:
    default: true
  shardedcore.homes:
    default: true
  shardedcore.homes.limit.3:
    default: true
  shardedcore.kits:
    default: true
  shardedcore.kits.admin:
    default: op
  shardedcore.live:
    default: true
  shardedcore.nametags.admin:
    default: op
  shardedcore.ping:
    default: true
  shardedcore.rtp:
    default: true
  shardedcore.sell:
    default: true
  shardedcore.sell.history:
    default: true
  shardedcore.sell.history.admin:
    default: op
  shardedcore.spawn:
    default: true
