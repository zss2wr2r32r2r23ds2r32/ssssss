name: ShardedCore
version: '${project.version}'
main: com.sharded.core.ShardedCore
api-version: '1.21'
author: Sharded
description: All-in-one core plugin for Paper 1.21.11
softdepend: [LuckPerms, PlaceholderAPI, ItemsAdder, Topper]
load: POSTWORLD

commands:
  shardedcore:
    description: ShardedCore admin command (reload)
    usage: /shardedcore [reload|help]
    aliases: [score, shardedc]
    permission: sharded.admin
  craft:
    description: Open a portable crafting table
    usage: /craft
    aliases: [workbench, wb]
  fix:
    description: Repair the item you are holding (6h cooldown)
    usage: /fix
    aliases: [repair]
  trash:
    description: Open a trash bin
    usage: /trash
    aliases: [disposal, bin]
  chattoggle:
    description: Toggle seeing public chat
    usage: /chattoggle
    aliases: [togglechat, ct]
  msg:
    description: Send a private message
    usage: /msg <player> <message>
    aliases: [tell, whisper, w, pm]
  reply:
    description: Reply to the last private message
    usage: /reply <message>
    aliases: [r]
  msgtoggle:
    description: Toggle receiving private messages
    usage: /msgtoggle
    aliases: [togglemsg, pmtoggle]
  nightvision:
    description: Toggle night vision
    usage: /nightvision
    aliases: [nv]
  kill:
    description: Kill yourself or another player
    usage: /kill [player]
  backpack:
    description: Open a backpack (single slot)
    usage: /backpack [player]
    aliases: [bp]
  armortrims:
    description: Open the armor trim station
    usage: /armortrims
    aliases: [trims, trimstation]
  fly:
    description: Toggle flight (region restricted)
    usage: /fly [player|speed <1-10>|pos1|pos2|setregion]
  autosmelt:
    description: Apply Auto Smelt to your pickaxe
    usage: /autosmelt
  rtp:
    description: Open the random teleport menu (factions world only)
    usage: /rtp
    aliases: [randomtp, wild]
  sb:
    description: Toggle the sidebar scoreboard
    usage: /sb
  deathtoggle:
    description: Toggle seeing death messages
    usage: /deathtoggle
    aliases: [deathmessages, dtoggle]
  jointoggle:
    description: Toggle join and leave messages
    usage: /jointoggle
    aliases: [joinleave, jtoggle]
  mobtoggle:
    description: Toggle natural mob spawning near you
    usage: /mobtoggle
    aliases: [mobspawn, mtoggle]
  killstreak:
    description: View killstreak stats
    usage: /killstreak [best|player] [best]
  toolname:
    description: Rename the item you are holding
    usage: /toolname [name]
  graves:
    description: Graves admin command
    usage: /graves [list|purge]
  spawners:
    description: Pay to pick up spawners
    usage: /spawners pay [amount]
  bal:
    description: Check your token balance
    usage: /bal
    aliases: [balance]
  tokens:
    description: Token admin commands
    usage: /tokens <give|set|remove|reset|giveall>
  tokenshop:
    description: Open the token shop
    usage: /tokenshop
  pets:
    description: Open the pets menu
    usage: /pets
  pet:
    description: Manage your cosmetic pet
    usage: /pet <equip|remove|rename> [args]
  temprank:
    description: Open the temporary rank shop
    usage: /temprank shop
    aliases: [rankshop, temprankshop]

permissions:
  sharded.admin:
    description: Access to /shardedcore reload
    default: op
  sharded.craft.use:
    default: true
  sharded.fix.use:
    default: true
  sharded.fix.bypass:
    default: op
  sharded.trash.use:
    default: true
  sharded.chat.toggle:
    default: true
  sharded.msg.use:
    default: true
  sharded.msg.toggle:
    default: true
  sharded.msg.bypass:
    default: op
  sharded.nightvision.use:
    default: true
  sharded.kill.use:
    default: true
  sharded.kill.others:
    default: op
  sharded.backpack.use:
    default: true
  sharded.backpack.view.others:
    default: op
  sharded.backpack.admin:
    description: View and take items from any player's backpack
    default: op
  sharded.backpack.slots.1:
    default: true
  sharded.backpack.slots.2:
    default: op
  sharded.backpack.slots.3:
    default: op
  sharded.backpack.slots.4:
    default: op
  sharded.backpack.slots.5:
    default: op
  sharded.backpack.slots.6:
    default: op
  sharded.backpack.slots.7:
    default: op
  sharded.backpack.slots.8:
    default: op
  sharded.backpack.slots.9:
    default: op
  sharded.graves.use:
    description: Skip graves on death (normal item drops) — grant to paid ranks
    default: false
  sharded.graves.duration.vip:
    description: Graves last 10 minutes
    default: false
  sharded.graves.duration.mvp:
    description: Graves last 15 minutes
    default: false
  sharded.graves.duration.ruby:
    description: Graves last 20 minutes
    default: false
  sharded.graves.duration.sapphire:
    description: Graves last 25 minutes
    default: false
  sharded.graves.duration.onyx:
    description: Graves last 30 minutes
    default: false
  sharded.graves.duration.aether:
    description: Graves last 40 minutes
    default: false
  sharded.graves.duration.flawless:
    description: Graves last 60 minutes
    default: false
  sharded.graves.bypass:
    default: op
  sharded.graves.admin:
    default: op
  sharded.armortrims.use:
    default: true
  sharded.fly.use:
    default: op
  sharded.fly.speed:
    default: op
  sharded.fly.others:
    default: op
  sharded.fly.anywhere:
    description: Bypass fly region bounds (region must still be set)
    default: op
  sharded.fly.admin:
    default: op
  sharded.autosmelt.use:
    default: op
  sharded.rtp.use:
    default: true
  sharded.rtp.bypass:
    default: op
  sharded.settings.use:
    default: true
  sharded.settings.scoreboard:
    default: true
  sharded.settings.deathmessages:
    default: true
  sharded.settings.joinmessages:
    default: true
  sharded.settings.mobspawn:
    default: true
  sharded.killstreak.use:
    description: View your own killstreak
    default: true
  sharded.killstreak.others:
    description: View other players' killstreaks
    default: op
  sharded.toolname.use:
    default: true
  sharded.pickupmobs.use:
    default: op
  sharded.spawners.use:
    default: true
  sharded.spawners.pickup:
    default: true
  sharded.tokens.admin:
    default: op
  sharded.tokenshop.use:
    default: true
  sharded.pets.use:
    description: Use the pets system
    default: true
  sharded.pets.parrot:
    default: true
  sharded.pets.axolotl:
    default: true
  sharded.pets.bee:
    default: true
  sharded.pets.warden:
    default: op
  sharded.pets.allay:
    default: op
  sharded.tempranks.use:
    description: Open and purchase from the temp rank shop
    default: true
