name: ShardedCore
version: '${project.version}'
main: com.sharded.core.ShardedCore
api-version: '1.21'
author: Sharded
description: All-in-one core plugin for Paper 1.21.11
softdepend: [LuckPerms, PlaceholderAPI, ItemsAdder, Topper]
load: STARTUP

commands:
  shardedcore:
    description: ShardedCore admin command (reload)
    usage: /shardedcore [reload|help]
    aliases: [score, shardedc]
    permission: sharded.admin
  craft:
    description: Open a portable crafting table
    usage: /craft
    aliases: [workbench, wb]
  fix:
    description: Repair the item you are holding (6h cooldown)
    usage: /fix
    aliases: [repair]
  trash:
    description: Open a trash bin
    usage: /trash
    aliases: [disposal, bin]
  chattoggle:
    description: Toggle seeing public chat
    usage: /chattoggle [toggle]
    aliases: [togglechat, ct, publicchat]
  msg:
    description: Send a private message
    usage: /msg <player> <message>
    aliases: [tell, whisper, w, pm]
  reply:
    description: Reply to the last private message
    usage: /reply <message>
    aliases: [r]
  msgtoggle:
    description: Toggle receiving private messages
    usage: /msgtoggle
    aliases: [togglemsg, pmtoggle]
  nightvision:
    description: Toggle night vision
    usage: /nightvision
    aliases: [nv]
  backpack:
    description: Open a backpack (single slot)
    usage: /backpack [player]
    aliases: [bp]
  armortrims:
    description: Open the armor trim station
    usage: /armortrims
    aliases: [trims, trimstation]
  fly:
    description: Toggle flight (region restricted)
    usage: /fly [player|speed <1-10>|pos1|pos2|setregion]
  autosmelt:
    description: Apply Auto Smelt to your pickaxe
    usage: /autosmelt
  rtp:
    description: Open the random teleport menu
    usage: /rtp
    aliases: [wild]
  randomtp:
    description: Teleport to a random online player (staff)
    usage: /randomtp
    permission: sharded.staff.randomtp
  spawn:
    description: Teleport to spawn or select spawn type
    usage: /spawn [select <main|vanilla>]
  spawnselect:
    description: Open the spawn selector menu
    usage: /spawnselect
    aliases: [spawnselector]
  setspawn:
    description: Set main or vanilla spawn locations
    usage: /setspawn <main/vanilla> [world]
  eglow:
    description: Open the glow equip menu
    usage: /eglow [color/off]
    aliases: [glows, glowing]
  chatcolor:
    description: Open the chat colour equip menu
    usage: /chatcolor
    aliases: [chatcolors]
  namecolor:
    description: Open the name colour equip menu
    usage: /namecolor [custom]
    aliases: [namecolors]
  wardrobe:
    description: Open your cosmetic hat wardrobe
    usage: /wardrobe
  tags:
    description: Open the tag equip menu
    usage: /tags
    aliases: [tag]
  deathtoggle:
    description: Toggle seeing death messages
    usage: /deathtoggle [toggle]
    aliases: [deathmessages, dtoggle]
  jointoggle:
    description: Toggle join and leave messages
    usage: /jointoggle [toggle]
    aliases: [joinleave, jtoggle, joinmessages]
  mobtoggle:
    description: Toggle natural mob spawning near you
    usage: /mobtoggle
    aliases: [mobspawn, mtoggle]
  settings:
    description: Open your personal settings menu
    usage: /settings
    aliases: [setting]
    permission: sharded.settings.use
  killstreak:
    description: View killstreak stats
    usage: /killstreak [best|player] [best]
  toolname:
    description: Rename the item you are holding
    usage: /toolname [name]
  graves:
    description: Graves admin command
    usage: /graves [list|purge]
  spawners:
    description: Pay to pick up spawners
    usage: /spawners pay [amount]
  bal:
    description: Check token balance
    usage: /bal [player]
    aliases: [balance]
  tokens:
    description: Token admin commands
    usage: /tokens <give|set|remove|reset|giveall>
  tokenshop:
    description: Open the token shop
    usage: /tokenshop
  pets:
    description: Open the pets menu
    usage: /pets
  pet:
    description: Manage your cosmetic pet
    usage: /pet <equip|remove|rename> [args]
  temprank:
    description: Open the temporary rank shop
    usage: /temprank shop
    aliases: [rankshop, temprankshop]
  gmc:
    description: Set creative mode
    usage: /gmc
  gms:
    description: Set survival mode
    usage: /gms
  gmsp:
    description: Set spectator mode
    usage: /gmsp
  staffmode:
    description: Toggle staff mode
    usage: /staffmode
    aliases: [sfmode]
  vanish:
    description: Toggle vanish
    usage: /vanish
  freeze:
    description: Freeze or unfreeze a player
    usage: /freeze <player>
  punish:
    description: Open punish menu for a player
    usage: /punish <player>
  ban:
    description: Ban a player
    usage: /ban <player> [reason] [duration]
  banip:
    description: IP ban a player
    usage: /banip <player> [reason] [duration]
  offend:
    description: Ban a player (offender ban)
    usage: /offend <player> [reason] [duration]
  unban:
    description: Unban a player
    usage: /unban <player>
  unbanip:
    description: Remove an IP ban
    usage: /unbanip <ip>
    aliases: [unban-ip]
  guide:
    description: Open the server guide menu
    usage: /guide
  rules:
    description: Open the server rules menu
    usage: /rules
    permission: sharded.guide.use
  unmute:
    description: Unmute a player
    usage: /unmute <player>
  pardon:
    description: Pardon a player (unban + unmute)
    usage: /pardon <player>
  wipe:
    description: Wipe a player's data
    usage: /wipe <player> [reason]
  alts:
    description: Show linked alt accounts
    usage: /alts [player]
  revokepunishment:
    description: Revoke all punishments except doxxing bans
    usage: /revokepunishment
    permission: sharded.punishments.revokepunishment
  stafflist:
    description: List online staff
    usage: /stafflist
  kick:
    description: Kick a player
    usage: /kick <player> [reason]
  mute:
    description: Mute a player
    usage: /mute <player> [reason] [duration]
  announce:
    description: Broadcast a server announcement
    usage: /announce <message>
  announcement:
    description: Broadcast a server announcement
    usage: /announcement <message>
  invrollback:
    description: Open inventory rollback for a player
    usage: /invrollback <player>
  screenshare:
    description: Start or stop a screenshare
    usage: /screenshare <player>
    aliases: [ss]
  staffchat:
    description: Send a message to staff chat
    usage: /staffchat <message>
    aliases: [sc]
  requeststaff:
    description: Request staff assistance
    usage: /requeststaff
  team:
    description: Team management
    usage: /team [subcommand]
  teams:
    description: Open the teams menu
    usage: /teams
    aliases: [t]
  discord:
    description: Show the Discord invite link
    usage: /discord
  store:
    description: Show the webstore link
    usage: /store
    aliases: [webstore, shop]
  headtokens:
    description: Convert a player head to tokens
    usage: /headtokens
  dailyrewards:
    description: Claim your daily reward
    usage: /dailyrewards
  daily:
    description: Claim your daily reward
    usage: /daily
  weeklyrewards:
    description: Claim your weekly reward
    usage: /weeklyrewards
  weekly:
    description: Claim your weekly reward
    usage: /weekly
  rewards:
    description: Open daily and weekly rewards menu
    usage: /rewards
    permission: sharded.rewards.use
  tokenmethods:
    description: Open ways to earn tokens GUI
    usage: /tokenmethods
  hourly:
    description: Check hourly token reward timer
    usage: /hourly
  stats:
    description: View player statistics
    usage: /stats [player]
    permission: sharded.stats.use
  leaderboard:
    description: Open leaderboards
    usage: /leaderboard [type]
    permission: sharded.leaderboards.use
  leaderboards:
    description: Open leaderboards
    usage: /leaderboards [type]
    permission: sharded.leaderboards.use
  media:
    description: Media requirements
    usage: /media
    permission: sharded.media.use
  mediareq:
    description: Media requirements
    usage: /mediareq
  mediarequirements:
    description: Media requirements
    usage: /mediarequirements
  crates:
    description: Open crate preview menu
    usage: /crates
  outpost:
    description: Outpost event info and admin setup
    usage: /outpost [pos1|pos2|setregion]
  koth:
    description: KOTH event info and admin setup
    usage: /koth [pos1|pos2|setregion]
  protect:
    description: Region protection setup
    usage: /protect [pos1|pos2|setregion <spawn|pvp|side1-4>]
  combat:
    description: Combat region setup
    usage: /combat [pos1|pos2|setregion]
  arena:
    description: Arena reset tools
    usage: /arena <reset|remove|snapshot> <region> [speed]
    permission: sharded.crates.use
  crate:
    description: Open crate preview menu
    usage: /crate
    permission: sharded.crates.use
  roles:
    description: Sync role permissions to a LuckPerms group
    usage: /role <rank>
    aliases: [roles]
    permission: sharded.roles.admin
  role:
    description: Sync role permissions to a LuckPerms group
    usage: /role <rank>
    permission: sharded.roles.admin
  gtp:
    description: Teleport to a player
    usage: /gtp <player>
    permission: sharded.staff.teleport
  gotoplayer:
    description: Teleport to a player
    usage: /gotoplayer <player>
    permission: sharded.staff.teleport

