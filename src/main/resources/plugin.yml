      shardedcore.settings.tpahere: true
      shardedcore.settings.joinleave: true
      shardedcore.settings.mobs: true
      shardedcore.settings.death: true
      shardedcore.settings.pay: true
      shardedcore.settings.nightvision: true
      shardedcore.settings.orders: true
      shardedcore.settings.bossbar: true
      shardedcore.settings.scoreboard: true
