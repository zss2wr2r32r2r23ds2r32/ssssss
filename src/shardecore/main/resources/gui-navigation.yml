config-version: 3

# Global GUI defaults used by every ShardedCore menu unless a module overrides them.
# Edit this file for: fillers, navigation items (slots are per-module), names, lores, and sounds.

fillers:
  inner:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
    lore: []
  border:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
    lore: []
  dark:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
    lore: []

sounds:
  open: UI_BUTTON_CLICK
  click: UI_BUTTON_CLICK
  close: BLOCK_CHEST_CLOSE
  navigate: UI_BUTTON_CLICK
  toggle: UI_BUTTON_CLICK
  success: ENTITY_EXPERIENCE_ORB_PICKUP
  error: BLOCK_NOTE_BLOCK_BASS
  volume: 1.0
  pitch: 1.0

# chat | actionbar | both — default for GUI toggle feedback when a module does not set message-mode
message-mode: inherit

back:
  material: BARRIER
  display_name: '&#FF0000&lBACK'
  lore:
    - '&8Description'
    - ''
    - '&#FF0000Information:'
    - '&#FF0000| &fClick here, to go'
    - '&#FF0000| &fto the previous page.'
    - ''
    - '&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Navigate'

previous:
  material: RED_DYE
  display_name: '&#FF005D&lPREVIOUS'
