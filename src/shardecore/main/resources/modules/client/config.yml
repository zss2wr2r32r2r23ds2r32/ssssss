config-version: 3
message-mode: chat

apply-delay-ticks: 40

# Escape menu disconnect text — installed into ItemsAdder (uses IA resource pack, no second prompt).
# The pause menu uppercases this string, so hex colours print as AD4EFF. Use &d / &f only.
# Default: purple Disconnect, white From, purple ShardedMC.
itemsadder-escape-menu:
  enabled: true
  auto-install: true
  namespace: shardedcore
  block-id: shardedcore_esc_menu
  disconnect-text: '&dDisconnect &fFrom &dShardedMC'
  install-path: 'plugins/ItemsAdder/contents/shardedcore/configs/esc_menu.yml'
  reload-on-install: false
  reload-command: iareload

discord-rpc:
  enabled: true
  send-without-detection: true
  game-name: 'Sharded MC'
  details: 'Playing Sharded MC'
  state: 'Online on ShardedMC'
  image-url: ''
  image-text: 'Sharded MC'
  show-player-count: true
