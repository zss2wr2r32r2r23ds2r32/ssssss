edit-title: "&8Edit %crate%"
preview-title: "&8Crate Preview"
select-title: "&8Select Rewards"
roll-title: "&8Opening..."
# Fallback rows when a crate has no rows set; each crate's own rows are used when > 0
preview-rows: 5
select-rows: 5
default-rows: 5
# When true, /crate edit always opens at least 5 rows
edit-force-5-rows: false
close-slot: 40
confirm-slot: 40
bundle-title: "&8Reward items"
bundle-rows: 4
default-animation: selectable
sound-tick: "ui.button.click"
sound-win: "entity.player.levelup"
# Optional lore shown only in preview / selection GUIs (not on the real reward item). Leave empty for none.
preview-lore: []
select-lore: []
config-version: 9

