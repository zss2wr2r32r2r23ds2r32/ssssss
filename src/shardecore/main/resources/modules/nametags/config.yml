config-version: 5
enabled: true
refresh: 20
display:
  background: '#00000000'
  brightness: 15
  view-distance: 32
  scale: 1.0
  y-offset: 0.35
  line-gap: 0.25
  line-width: 1000
  text-opacity: 255
  see-through: false
  shadow: true
  hide-when-sneaking: true
  hide-when-invisible: true
  hide-own: false
  ride: true
  teleport-duration: 2
disabled-worlds: []
lines:
  top:
    enabled: true
    interval: 0
    refresh: 100
    frames:
      - '%luckperms_prefix%%colored_name% %shardedcore_tag% %luckperms_suffix%'
  bottom:
    enabled: true
    interval: 800
    refresh: 40
    frames:
      - '&#FF0000🗡 &#FF0000%statistic_player_kills% &7| &#FB7B0B☠ &#FB7B0B%statistic_deaths% &7| &#FFF300⌛ &#FFF300%statistic_time_played%'
      - '&#5C94FC⬡ &#5C94FC%shardedcore_tokens_formatted% &7| &#F47714⚑ &#F47714%shardedcore_team% &7| &#FFD700✦ &#FFD700%shardedcore_elo%'
