config-version: 2
message-mode: chat

# Import these folders on boot when level.dat exists.
auto-import:
  - world
  - world_nether
  - world_end
  - spawn
  - duels

# Also import any other world folders found in the server directory (and rescan).
auto-import-all: true
rescan-seconds: 30

# Shared inventories / enderchests / stats across all worlds (vanilla Multiverse default).
cross-world-inventories: true
cross-world-enderchests: true
cross-world-stats: true

# Block deleting the main overworld unless explicitly allowed.
allow-delete-main: false
