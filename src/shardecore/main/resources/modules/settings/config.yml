config-version: 11
# Personal settings — one 5-row menu. No TPA, mob spawn, fast crystals, or payments.

on-color: "&#9FFF00"
off-color: "&#FF2121"
on-text: "&lON"
off-text: "&lOFF"
sound-open: "block.note_block.pling"
sound-toggle: "ui.button.click"
message-channel: chat
filler-style: bordered-inner

defaults:
  public-chat: true
  private-msg: true
  live: true
  scoreboard: true
  night-vision: false
  death-msgs: true
  join-leave: true
  rtpqueue: true

