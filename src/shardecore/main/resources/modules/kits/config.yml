config-version: 8
gui-title: "&8Kits"
admin-gui-title: "&8Kit Admin"
preview-title: "&8Kit Preview - %kit%"
edit-title: "&8Edit Kit - %kit%"
delete-title: "&8Delete %kit%?"
default-cooldown-seconds: 3600
store-command: "store"
sound-success: "entity.experience_orb.pickup"
rows: 5
admin-rows: 5
message-channel: chat
filler: GRAY_STAINED_GLASS_PANE
star: "★"
star-color: "&#FFD700"

# When false, kits.admin does not skip claim cooldown (kits.bypass / kits.no.cooldown still do)
admin-bypass-cooldown: false

# Left-click claims, right-click previews. Preview rearranges are saved per-player
# under kits/layouts/<uuid>.yml (not the global kit definition).
lore-available:
  - "&8%description%"
  - ""
  - "%stars%"
  - ""
  - "%color%Information:"
  - "%color%| &fClick To Claim"
  - "%color%| %color%&n%kit%&r %color%Kit"
  - ""
  - "%color%⏳ &fCooldown: %color%%cooldown%"
  - ""
  - "%action%"
lore-cooldown:
  - "&8%description%"
  - ""
  - "%stars%"
  - ""
  - "%color%Information:"
  - "%color%| &fOn cooldown"
  - "%color%| %color%&n%kit%&r %color%Kit"
  - ""
  - "%color%⏳ &fCooldown: %color%%cooldown%"
  - ""
  - "%action%"
lore-locked:
  - "&8%description%"
  - ""
  - "%stars%"
  - ""
  - "%color%Information:"
  - "%color%| &fLocked"
  - "%color%| %color%&n%kit%&r %color%Kit"
  - ""
  - "%color%☀ &fRank: %color%&l%kit% %color%Rank"
  - ""
  - "%action%"

lore-owned:
  - "&8Description"
  - ""
  - "%color%Information:"
  - "%color%| &fClick To Claim"
  - "%color%| %color%&n%kit%&r %color%Kit"
  - ""
  - "%color%⏳ &fCooldown: %color%%cooldown%"
  - ""
  - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Claim"
lore-owned-note: unused-legacy

default-action-available: "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To Claim"
