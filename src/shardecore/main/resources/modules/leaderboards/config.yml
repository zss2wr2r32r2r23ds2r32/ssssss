config-version: 18
message-mode: chat
fetch-limit: 5000
refresh-interval-seconds: 120
refresh-slot: -1
refresh-name: '%color%&lMost %statistic%'
refresh-lore:
  - '&8Leaderboard'
  - ''
  - '%color%Information:'
  - '%color%| &fRankings refresh in'
  - '%color%| &f%time%'
hub-refresh-slot: -1
hub-refresh-name: '%color%&lREFRESHES IN'
hub-refresh-lore:
  - '&8Leaderboard'
  - ''
  - '%color%Information:'
  - '%color%| &fRankings refresh in'
  - '%color%| &f%time%'

teams:
