# SetupCore-style leaderboard GUI (current ShardedCore boards)
gui-title: "&8Leaderboards"
board-title: "&8Leaderboards | %statistic%"
lore-version: 5
rows: 5
board-rows: 6
back-slot: 45
you-slot: 49
sound-open: "block.note_block.pling"
board-slots: [19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]

# Extra player heads: slot -> rank on this board. Example shows #1 at slot 4.
# position-heads:
#   4: 1
position-heads: {}

main:
  head-slot: 13
  head-name: "&#0098FF%playername%"
  head-lore:
    - "&8Description"
    - ""
    - "&#0098FFInformation:"
    - "&#0098FF| &fYour Ranking overall"
    - "&#0098FF| &fThrough all leaderboards"
    - ""
    - "&#0098FF☀ &fRank: &#0098FF%rank%"

category-lore:
  - "&8Description"
  - ""
  - "%color%Information:"
  - "%color%| &fClick here to View"
  - "%color%| &fTop %statistic%"
  - ""
  - "%color%%symbol%&fYour Rank: %color%%rank%"
  - "%color%☀ &fYour %score_label%: %color%%score%"

entry-lore:
  - "&8Description"
  - "%color%Information:"
  - "%color%%symbol%&fRank: %color%%rank%"
  - "%color%☀ &f%score_label%: %color%%score%"
  - ""
  - "&x&F&F&B&A&0&0▷ &x&F&F&B&A&0&0&l&nCLICK&r &x&F&F&B&A&0&0To View Stats"

you-name: '%color%&lYOUR %score_label%'
you-lore:
