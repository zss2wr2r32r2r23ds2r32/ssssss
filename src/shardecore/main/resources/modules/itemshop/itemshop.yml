  shown-expires: 0
  shulkers:
    halloween: ORANGE_SHULKER_BOX
    christmas: GREEN_SHULKER_BOX
    easter: PINK_SHULKER_BOX
  seasons:
    halloween: []
    christmas: []
    easter: []
