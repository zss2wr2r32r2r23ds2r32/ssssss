# ╔══════════════════════════════════════════════╗
# ║   SeaTeams 2.0 — Sounds Config                  ║
# ║   Set enabled: false to disable any sound    ║
# ╚══════════════════════════════════════════════╝
# Volume: 0.0 - 1.0  |  Pitch: 0.5 - 2.0

team-created:
  enabled: true
  sound: ENTITY_PLAYER_LEVELUP
  volume: 0.8
  pitch: 1.2

team-disbanded:
  enabled: true
  sound: ENTITY_WITHER_DEATH
  volume: 0.5
  pitch: 0.8

member-joined:
  enabled: true
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  volume: 0.7
  pitch: 1.0

member-left:
  enabled: true
  sound: ENTITY_ITEM_BREAK
  volume: 0.5
  pitch: 1.0

invite-received:
  enabled: true
  sound: BLOCK_NOTE_BLOCK_PLING
  volume: 0.8
  pitch: 1.5

invite-accepted:
  enabled: true
  sound: ENTITY_PLAYER_LEVELUP
  volume: 0.7
  pitch: 1.0

bank-deposit:
  enabled: false
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  volume: 0.6
  pitch: 1.2

bank-withdraw:
  enabled: false
  sound: ENTITY_ITEM_PICKUP
  volume: 0.6
  pitch: 0.8

home-teleport:
  enabled: false
  sound: ENTITY_ENDERMAN_TELEPORT
  volume: 0.7
  pitch: 1.0

ally-formed:
  enabled: true
  sound: BLOCK_NOTE_BLOCK_CHIME
  volume: 0.8
  pitch: 1.0

ally-revoked:
  enabled: true
  sound: BLOCK_NOTE_BLOCK_BASS
  volume: 0.5
  pitch: 0.8

promoted:
  enabled: true
  sound: ENTITY_PLAYER_LEVELUP
  volume: 0.8
  pitch: 1.5

demoted:
  enabled: true
  sound: ENTITY_ITEM_BREAK
  volume: 0.5
  pitch: 0.7

gui-click:
  enabled: true
  sound: UI_BUTTON_CLICK
  volume: 0.3
  pitch: 1.0

gui-open:
  enabled: true
  sound: BLOCK_CHEST_OPEN
  volume: 0.4
  pitch: 1.2

error:
  enabled: true
  sound: BLOCK_NOTE_BLOCK_BASS
  volume: 0.4
  pitch: 0.5

# Help alert — sender confirmation (quick "ping")
help-sent-self:
  enabled: true
  sound: BLOCK_NOTE_BLOCK_PLING
  volume: 0.6
  pitch: 1.5

# Help alert — receivers (urgent attention-grabbing chime, NOT bell)
help-alert:
  enabled: true
  sound: ENTITY_PLAYER_LEVELUP
  volume: 1.0
  pitch: 0.8
