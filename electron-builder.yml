appId: com.avix.launcher
productName: Avix Launcher
copyright: Copyright © 2026 Avix
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraMetadata:
  main: out/main/index.js
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Avix Launcher
  uninstallDisplayName: Avix Launcher
  installerLanguages:
    - en_US
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
linux:
  icon: resources/icon.png
  target:
    - dir
mac:
  icon: resources/icon.png
  target:
    - dir
publish:
  provider: github
  owner: zss2wr2r32r2r23ds2r32
  repo: ssssss
  releaseType: release
